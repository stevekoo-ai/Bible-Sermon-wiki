der": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 8, "lab": "8", "cat": "m", "date": "BC 2080", "title": "여호와의 사자 — 도망친 하갈을 만남", "note": "창 16:7 · 술 길 샘물", "desc": "BC 2080년, 임신한 하갈이 사래의 학대를 피해 도망하다 술 길 샘물 곁에서 여호와의 사자를 만났다. 하갈은 '나를 살피시는 하나님(엘 로이)'이라 고백하고 돌아가 이스마엘을 낳았다.", "place": "술 길 샘", "pnote": "정확한 위치 불명 — 가나안 남부에서 애굽으로 가는 '술 길' 위 임의 지점", "col": "#C78BE8", "route": "헤브론 → 술 길 샘", "lat": 30.85, "lon": 34.35, "flat": 30.85, "flon": 34.35, "fname": "술 길 샘", "fnote": "정확한 위치 불명 — 가나안 남부에서 애굽으로 가는 '술 길' 위 임의 지점", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 9, "lab": "9", "cat": "p1", "date": "BC 2066", "title": "이삭 출생", "note": "창 21 · 브엘세바 부근", "desc": "BC 2066년, 약속하신 지 25년 만에 100세 아브라함과 90세 사라 사이에서 약속의 아들 이삭('웃음')이 태어났다.", "place": "브엘세바", "pnote": "텔 베에르 셰바 유적 기준 — 통설", "col": "#F2C14E", "route": "", "lat": 31.245, "lon": 34.84, "flat": 31.245, "flon": 34.84, "fname": "브엘세바", "fnote": "텔 베에르 셰바 유적 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 10, "lab": "10", "cat": "m", "date": "BC 2050경", "title": "모리아산 — 이삭을 바침, 여호와의 사자", "note": "창 22 · 모리아 = 훗날 성전 터(대하 3:1)", "desc": "BC 2050년경, 하나님이 아브라함에게 이삭을 모리아 땅 한 산에서 번제로 드리라 하셨고, 칼을 든 순간 여호와의 사자가 막아 숫양을 대신 준비하셨다(여호와 이레). 모리아는 훗날 솔로몬 성전 터가 된다(대하 3:1).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "브엘세바 → 예루살렘", "lat": 31.78620555816661, "lon": 35.226551275413506, "flat": 31.778437731590273, "flon": 35.23503130314223, "fname": "예루살렘", "fnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 11, "lab": "11", "cat": "p1", "date": "BC 1929경", "title": "야곱, 에서를 피해 하란으로 (벧엘의 꿈)", "note": "창 28", "desc": "BC 1929년경, 장자의 축복을 가로챈 야곱이 형 에서를 피해 외삼촌 라반이 있는 하란으로 도망했고, 가는 길에 벧엘에서 하늘에 닿은 사다리 꿈을 꾸었다.", "place": "하란", "pnote": "하란 유적(튀르키예 샨르우르파주) 기준 — 통설", "col": "#F2C14E", "route": "브엘세바 → 벧엘 → 하란", "lat": 36.873105558166614, "lon": 39.022151275413506, "flat": 36.86533773159028, "flon": 39.03063130314223, "fname": "하란", "fnote": "하란 유적(튀르키예 샨르우르파주) 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 12, "lab": "12", "cat": "p1", "date": "BC 1909경", "title": "야곱 귀향 — 브니엘에서 '이스라엘'", "note": "창 32-33", "desc": "BC 1909년경, 하란에서 20년을 지낸 야곱이 가족과 함께 돌아오다 얍복 강 브니엘에서 밤새 씨름한 끝에 '이스라엘'이라는 새 이름을 받고, 형 에서와 화해했다.", "place": "세겜", "pnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "col": "#F2C14E", "route": "하란 → 브니엘(얍복) → 세겜", "lat": 32.221805558166615, "lon": 35.273151275413504, "flat": 32.21403773159028, "flon": 35.28163130314223, "fname": "세겜", "fnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 13, "lab": "13", "cat": "p1", "date": "BC 1900경", "title": "유다와 다말 — 베레스·세라 출생", "note": "창 38 · 족보 첫 여인", "desc": "BC 1900년경, 야곱의 넷째 아들 유다가 아둘람에 머물 때 며느리 다말에게서 쌍둥이 베레스와 세라를 얻었다. 다말은 마태복음 족보에 이름이 오른 첫 여인이다.", "place": "아둘람", "pnote": "텔 아둘람 기준 — 통설", "col": "#F2C14E", "route": "", "lat": 31.65, "lon": 34.99, "flat": 31.65, "flon": 34.99, "fname": "아둘람", "fnote": "텔 아둘람 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 14, "lab": "14", "cat": "p1", "date": "BC 1876", "title": "야곱 가족 70명 애굽 이주 (베레스·헤스론 포함)", "note": "창 46:12", "desc": "BC 1876년, 총리가 된 요셉의 초청으로 130세 야곱과 가족 70명이 브엘세바에서 제사를 드린 뒤 애굽 고센 땅으로 이주했다. 명단에 유다의 손자 헤스론도 들어 있다(창 46:12).", "place": "고센(라암셋)", "pnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "col": "#F2C14E", "route": "헤브론 → 브엘세바 → 고센(라암셋)", "lat": 30.799, "lon": 31.834, "flat": 30.799, "flon": 31.834, "fname": "고센(라암셋)", "fnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 15, "lab": "15", "cat": "p1", "date": "BC 1876–1446", "title": "400년 종살이 — 람·아미나답 세대", "note": "출 1 · 창 15:13 성취", "desc": "BC 1876~1446년, 요셉을 모르는 새 왕이 일어나 이스라엘 자손을 노예로 삼아 국고성 비돔과 라암셋을 짓게 했다. 람과 아미나답이 이 종살이 시대를 살았고, 창 15:13의 400년 예언이 이루어지고 있었다.", "place": "고센(라암셋)", "pnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "col": "#F2C14E", "route": "", "lat": 30.80710555816661, "lon": 31.825151275413504, "flat": 30.799337731590274, "flon": 31.83363130314223, "fname": "고센(라암셋)", "fnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 16, "lab": "16", "cat": "m", "date": "BC 1447", "title": "떨기나무 — 여호와의 사자, 모세를 부르심", "note": "출 3", "desc": "BC 1447년, 미디안 광야에서 양을 치던 80세 모세에게 호렙산 떨기나무 불꽃 가운데 여호와의 사자가 나타나 '나는 스스로 있는 자'라 이름을 알리시고 애굽으로 보내셨다.", "place": "시내산(호렙)", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "col": "#C78BE8", "route": "", "lat": 28.5392, "lon": 33.975, "flat": 28.5392, "flon": 33.975, "fname": "시내산(호렙)", "fnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 17, "lab": "17", "cat": "p1", "date": "BC 1446", "title": "출애굽 — 나손 세대", "note": "출 12-14 · 홍해 도하 위치는 논쟁 중", "desc": "BC 1446년, 열 가지 재앙과 유월절 후 이스라엘 백성이 라암셋을 떠나 숙곳을 거쳐 홍해를 건너 시내산으로 향했다. 유다 지파 족장 나손이 이 세대이다.", "place": "시내산(호렙)", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "col": "#F2C14E", "route": "고센(라암셋) → 숙곳 → 홍해 → 시내산(호렙)", "lat": 28.547305558166613, "lon": 33.96615127541351, "flat": 28.539537731590276, "flon": 33.97463130314223, "fname": "시내산(호렙)", "fnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 18, "lab": "18", "cat": "m", "date": "BC 1446", "title": "시내산 언약 · 십계명 — 선지자 모세", "note": "출 19-20", "desc": "BC 1446년, 출애굽 3개월째 시내산에서 하나님이 모세를 통해 십계명을 주시고 이스라엘과 언약을 맺으셨다. 선지자들은 이 언약을 '신혼 때의 사랑', 곧 결혼으로 회고한다(렘 2:2).", "place": "시내산(호렙)", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "col": "#C78BE8", "route": "", "lat": 28.52229452599794, "lon": 33.97648490698889, "flat": 28.538495605249913, "flon": 33.97506187112454, "fname": "시내산(호렙)", "fnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 19, "lab": "19", "cat": "p1", "date": "BC 1445–1406", "title": "광야 40년", "note": "민수기", "desc": "BC 1445~1406년, 가데스 바네아에서 정탐꾼의 부정적 보고를 믿고 원망한 출애굽 1세대가 광야에서 40년을 방황하다 죽고, 모세는 느보산에서 약속의 땅을 바라본 뒤 숨을 거두었다.", "place": "느보산", "pnote": "요르단 느보산(라스 시야가) 전통 위치", "col": "#F2C14E", "route": "시내산(호렙) → 가데스 바네아 → 느보산", "lat": 31.768, "lon": 35.726, "flat": 31.768, "flon": 35.726, "fname": "느보산", "fnote": "요르단 느보산(라스 시야가) 전통 위치", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 20, "lab": "20", "cat": "p1", "date": "BC 1406", "title": "가나안 입성 — 여리고, 살몬과 라합", "note": "수 2, 6", "desc": "BC 1406년, 여호수아가 이끄는 이스라엘이 요단강을 건너 여리고를 무너뜨렸다. 정탐꾼을 숨겨 준 기생 라합이 구원받아 유다 지파 살몬과 결혼하고 보아스를 낳는다(마 1:5).", "place": "여리고", "pnote": "텔 에스-술탄 유적 기준", "col": "#F2C14E", "route": "느보산 → 여리고", "lat": 31.8711, "lon": 35.444, "flat": 31.8711, "flon": 35.444, "fname": "여리고", "fnote": "텔 에스-술탄 유적 기준", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 21, "lab": "21", "cat": "m", "date": "BC 1373–1334", "title": "사사 옷니엘", "note": "삿 1:13; 3:9", "desc": "BC 1373~1334년, 갈렙의 조카 옷니엘이 메소보다미아 왕 구산 리사다임에게서 이스라엘을 구원한 첫 사사가 되어 40년간 평화를 이끌었다.", "place": "드빌", "pnote": "키르벳 라부드(헤브론 남서) 기준 — 통설", "col": "#C78BE8", "route": "", "lat": 31.499, "lon": 34.967, "flat": 31.499, "flon": 34.967, "fname": "드빌", "fnote": "키르벳 라부드(헤브론 남서) 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 22, "lab": "22", "cat": "m", "date": "BC 1316–1236", "title": "사사 에훗 — 모압 왕 에글론", "note": "삿 3", "desc": "BC 1316~1236년, 왼손잡이 에훗이 모압 왕 에글론을 찔러 죽이고 이스라엘을 구원해 80년간 평화가 이어졌다. 모압이 차지했던 '종려나무 성읍' 여리고 일대가 무대이다.", "place": "여리고", "pnote": "텔 에스-술탄 유적 기준", "col": "#C78BE8", "route": "", "lat": 31.87920555816661, "lon": 35.43515127541351, "flat": 31.871437731590273, "flon": 35.44363130314223, "fname": "여리고", "fnote": "텔 에스-술탄 유적 기준", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 23, "lab": "23", "cat": "m", "date": "BC 1216–1176", "title": "사사 드보라·바락 — 다볼산", "note": "삿 4-5", "desc": "BC 1216~1176년, 여선지자이자 사사 드보라가 바락과 함께 다볼산에서 가나안 왕 야빈의 군대장관 시스라의 철병거 900대를 물리쳤다.", "place": "다볼산", "pnote": "다볼산 정상 기준 — 확실", "col": "#C78BE8", "route": "", "lat": 32.687, "lon": 35.39, "flat": 32.687, "flon": 35.39, "fname": "다볼산", "fnote": "다볼산 정상 기준 — 확실", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 24, "lab": "24", "cat": "m", "date": "BC 1169", "title": "사사 기드온 — 여호와의 사자가 부름", "note": "삿 6", "desc": "BC 1169년, 미디안의 압제로 포도주 틀에 숨어 밀을 타작하던 기드온을 여호와의 사자가 '큰 용사여'라 부르셨고, 기드온은 300명으로 미디안을 이겼다.", "place": "오브라", "pnote": "기드온의 오브라 — 위치 불명, 이스르엘 골짜기 부근으로 표시", "col": "#C78BE8", "route": "", "lat": 32.607, "lon": 35.289, "flat": 32.607, "flon": 35.289, "fname": "오브라", "fnote": "기드온의 오브라 — 위치 불명, 이스르엘 골짜기 부근으로 표시", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 25, "lab": "25", "cat": "p1", "date": "BC 1140경", "title": "룻이 나오미와 베들레헴으로 — 보아스·오벳", "note": "룻 1-4 · 모압 여인", "desc": "BC 1140년경, 사사 시대 흉년에 모압으로 갔다가 남편과 두 아들을 잃은 나오미가 며느리 룻과 베들레헴으로 돌아왔고, 룻은 기업 무를 자 보아스와 결혼해 다윗의 할아버지 오벳을 낳았다.", "place": "베들레헴", "pnote": "현 베들레헴(예수 탄생 교회) 기준", "col": "#F2C14E", "route": "모압 → 베들레헴", "lat": 31.7054, "lon": 35.2024, "flat": 31.7054, "flon": 35.2024, "fname": "베들레헴", "fnote": "현 베들레헴(예수 탄생 교회) 기준", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 26, "lab": "26", "cat": "m", "date": "BC 1107–1067", "title": "제사장·사사 엘리 — 실로 성막", "note": "삼상 1-4", "desc": "BC 1107~1067년, 제사장 엘리가 실로 성막에서 40년간 이스라엘을 다스렸으나, 아들 홉니와 비느하스의 죄로 언약궤를 블레셋에 빼앗기고 '이가봇(영광이 떠났다)'의 날을 맞았다.", "place": "실로", "pnote": "텔 실로 유적 기준 — 확실", "col": "#C78BE8", "route": "", "lat": 32.0556, "lon": 35.2897, "flat": 32.0556, "flon": 35.2897, "fname": "실로", "fnote": "텔 실로 유적 기준 — 확실", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 27, "lab": "27", "cat": "m", "date": "BC 1095", "title": "여호와의 사자 — 삼손의 부모", "note": "삿 13", "desc": "BC 1095년경, 소라의 마노아 아내에게 여호와의 사자가 나타나 블레셋에게서 이스라엘을 구원하기 시작할 나실인 아들 삼손의 출생을 알렸다.", "place": "소라", "pnote": "텔 초라 기준 — 통설", "col": "#C78BE8", "route": "", "lat": 31.776, "lon": 34.982, "flat": 31.776, "flon": 34.982, "fname": "소라", "fnote": "텔 초라 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 28, "lab": "28", "cat": "m", "date": "BC 1086–1080", "title": "사사 입다", "note": "삿 11", "desc": "BC 1086~1080년, 기생의 아들로 쫓겨났던 길르앗 사람 입다가 사사로 세워져 암몬을 물리쳤으나, 경솔한 서원으로 외동딸을 잃는 비극을 겪었다.", "place": "길르앗 미스바", "pnote": "위치 불명 — 요단강 동편 길르앗 지역 대표 지점", "col": "#C78BE8", "route": "", "lat": 32.33, "lon": 35.8, "flat": 32.33, "flon": 35.8, "fname": "길르앗 미스바", "fnote": "위치 불명 — 요단강 동편 길르앗 지역 대표 지점", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 29, "lab": "29", "cat": "m", "date": "BC 1075–1055", "title": "사사 삼손", "note": "삿 14-16", "desc": "BC 1075~1055년, 나실인 삼손이 20년간 사사로 블레셋과 싸웠고, 들릴라에게 비밀을 누설해 힘을 잃었다가 마지막에 다곤 신전을 무너뜨리며 죽었다.", "place": "소라", "pnote": "텔 초라 기준 — 통설", "col": "#C78BE8", "route": "", "lat": 31.784105558166612, "lon": 34.97315127541351, "flat": 31.776337731590274, "flon": 34.98163130314223, "fname": "소라", "fnote": "텔 초라 기준 — 통설", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 30, "lab": "30", "cat": "m", "date": "BC 1025경", "title": "사무엘(마지막 사사·선지자)이 이새의 아들 다윗에게 기름부음", "note": "삼상 16", "desc": "BC 1025년경, 마지막 사사이자 선지자 사무엘이 라마에서 베들레헴으로 가서, 사울 대신 이새의 막내아들 소년 다윗에게 기름을 부었다. '사람은 외모를 보거니와 여호와는 중심을 보느니라'(삼상 16:7).", "place": "베들레헴", "pnote": "현 베들레헴(예수 탄생 교회) 기준", "col": "#C78BE8", "route": "라마 → 베들레헴", "lat": 31.713505558166613, "lon": 35.193551275413505, "flat": 31.705737731590276, "flon": 35.20203130314223, "fname": "베들레헴", "fnote": "현 베들레헴(예수 탄생 교회) 기준", "hasfine": false, "sz": false, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 31, "lab": "31", "cat": "p1", "date": "BC 1010 → 1003", "title": "다윗 — 헤브론에서 즉위, 예루살렘으로 / 나단의 다윗 언약", "note": "삼하 2, 5, 7", "desc": "BC 1010년, 다윗이 헤브론에서 유다의 왕이 되고 7년 반 뒤 예루살렘을 정복해 수도로 삼았다. 선지자 나단을 통해 '네 왕위가 영원히 견고하리라'는 다윗 언약을 받았다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#F2C14E", "route": "헤브론 → 예루살렘", "lat": 31.761194525997936, "lon": 35.236884906988884, "flat": 31.7737, "flon": 35.2362, "fname": "다윗성", "fnote": "다윗이 여부스 족속에게서 빼앗아 수도로 삼은 시온 산성(삼하 5:7)", "hasfine": true, "sz": true, "folder": "1기 · 약속 (아브라함 → 다윗)"}, {"n": 32, "lab": "32", "cat": "p2", "date": "BC 959", "title": "솔로몬 성전 완공 — 하늘에서 불", "note": "왕상 8; 대하 7:1", "desc": "BC 959년, 다윗의 아들 솔로몬이 7년 공사 끝에 모리아산에 성전을 완공했다. 봉헌 기도를 마치자 하늘에서 불이 내려 제물을 태우고 여호와의 영광이 성전에 가득했다(대하 7:1).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#4FA3E0", "route": "", "lat": 31.794596076774255, "lon": 35.24804434462745, "flat": 31.77805, "flon": 35.23545, "fname": "성전산", "fnote": "솔로몬이 모리아산에 세운 성전 — 하늘에서 불이 내림(대하 7:1)", "hasfine": true, "sz": true, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 33, "lab": "33", "cat": "p2", "date": "BC 931", "title": "왕국 분열 — 르호보암이 세겜에 갔다가 거절당함", "note": "왕상 12:1-19", "desc": "BC 931년, 솔로몬이 죽은 뒤 아들 르호보암이 세겜에서 왕으로 세워지려 했으나, 멍에를 가볍게 해 달라는 백성의 요구를 '전갈 채찍'으로 거절해 북쪽 10지파가 떨어져 나갔다.", "place": "세겜", "pnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "col": "#4FA3E0", "route": "예루살렘 → 세겜", "lat": 32.196794525997944, "lon": 35.28348490698888, "flat": 32.212995605249915, "flon": 35.28206187112453, "fname": "세겜", "fnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "hasfine": false, "sz": false, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 33, "lab": "33", "cat": "p2", "date": "BC 931", "title": "여로보암 — 벧엘의 금송아지 (남쪽 끝)", "note": "왕상 12:28-29", "desc": "BC 931년, 북이스라엘의 첫 왕 여로보암이 백성이 예루살렘 성전으로 가면 마음이 돌아설까 두려워 남쪽 끝 벧엘에 금송아지를 세우고 '이스라엘아 너희를 애굽에서 인도한 신이라' 했다.", "place": "벧엘", "pnote": "베이틴 마을 기준 — 통설(엘-비레설도 있음)", "col": "#4FA3E0", "route": "세겜 → 벧엘", "lat": 31.93, "lon": 35.2217, "flat": 31.93, "flon": 35.2217, "fname": "벧엘", "fnote": "베이틴 마을 기준 — 통설(엘-비레설도 있음)", "hasfine": false, "sz": false, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 33, "lab": "33", 281, "fname": "시내산(호렙)", "fnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "hasfine": false, "sz": false, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 37, "lab": "37", "cat": "p2", "date": "BC 853–841", "title": "요람 — 아합의 딸 아달랴와 결혼", "note": "왕하 8:16-18", "desc": "BC 853~841년, 남유다 왕 요람이 아합과 이세벨의 딸 아달랴와 결혼해 바알 숭배가 남유다에까지 들어왔다. 훗날 아달랴는 다윗 왕족을 죽이고 왕위를 빼앗는다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#4FA3E0", "route": "", "lat": 31.763702237765585, "lon": 35.2580429777777, "flat": 31.7765, "flon": 35.2368, "fname": "왕궁 구역(추정)", "fnote": "요람이 아합의 딸 아달랴를 맞은 유다 왕궁", "hasfine": true, "sz": true, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 37, "lab": "37", "cat": "m", "date": "BC 848–797", "title": "엘리사 — 사마리아·도단", "note": "왕하 2-13", "desc": "BC 848~797년, 엘리야의 뒤를 이은 엘리사가 사마리아를 중심으로 활동했고, 도단에서 아람 군대에 포위되었을 때 사환의 눈을 열어 산에 가득한 불말과 불병거를 보게 했다(왕하 6).", "place": "도단", "pnote": "텔 도탄 유적 기준 — 통설", "col": "#C78BE8", "route": "사마리아 → 도단", "lat": 32.413, "lon": 35.238, "flat": 32.413, "flon": 35.238, "fname": "도단", "fnote": "텔 도탄 유적 기준 — 통설", "hasfine": false, "sz": false, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 38, "lab": "38-1", "cat": "m", "date": "BC 785경", "title": "요나 — 다시스로 도망, 폭풍과 큰 물고기", "note": "욘 1:1-17", "desc": "BC 785년경, 여로보암 2세 시대의 선지자 요나가 '니느웨로 가라'는 명령을 피해 욥바에서 다시스(스페인 남부 타르테소스로 추정)행 배를 탔으나, 큰 폭풍 속에 바다에 던져져 큰 물고기 뱃속에서 사흘 밤낮을 보냈다.", "place": "지중해(요나의 폭풍)", "pnote": "위치 불명 — 욥바에서 다시스(스페인 남부 타르테소스 추정) 방향 바다 위 임의 지점", "col": "#C78BE8", "route": "욥바 → 지중해(요나의 폭풍)", "lat": 33.2, "lon": 32.6, "flat": 33.2, "flon": 32.6, "fname": "지중해(요나의 폭풍)", "fnote": "위치 불명 — 욥바에서 다시스(스페인 남부 타르테소스 추정) 방향 바다 위 임의 지점", "hasfine": false, "sz": false, "folder": "2기 · 왕국과 몰락 (다윗 → 바벨론 포로)"}, {"n": 38.5, "lab": "38-2", "cat": "m", "date": "BC 785경", "title": "요나 — 물고기 배에서 나와 니느웨로", "note": "욘 2:10–3:10", "desc": "BC 785년경, 물고기 뱃속에서 기도한 요나를 물고기가 육지에 토해 냈고, 요나는 앗수르의 수도 니느웨로 가서 '사십 일이 지나면 니느웨가 무너지리라'고 외쳤다. 왕부터 백성까지 회개하자 하나님이 재앙을 거두셨다.", "place ": 35.23545, "fname": "성전", "fnote": "마카비가 성전을 정결하게 하고 봉헌한 곳(수전절)", "hasfine": true, "sz": true, "folder": "3기 · 회복 (포로 → 그리스도)"}, {"n": 68, "lab": "68", "cat": "x", "date": "BC 63", "title": "로마 폼페이우스 — 예루살렘 점령 (야곱 세대 추정)", "note": "성경 밖 역사", "desc": "BC 63년, 로마 장군 폼페이우스가 하스몬 왕조의 내분을 틈타 예루살렘을 점령하고 지성소에까지 들어갔다. 이때부터 유대는 로마의 지배를 받는다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#9A9A9A", "route": "로마 → 예루살렘", "lat": 31.73687112847798, "lon": 35.20104624979684, "flat": 31.77805, "flon": 35.23545, "fname": "성전", "fnote": "폼페이우스가 지성소까지 들어간 곳", "hasfine": true, "sz": true, "folder": "3기 · 회복 (포로 → 그리스도)"}, {"n": 69, "lab": "69", "cat": "p3", "date": "BC 37–4", "title": "헤롯 대왕 — 성전 증축 (요셉 세대)", "note": "요 2:20", "desc": "BC 37~4년, 로마가 세운 에돔 출신 헤롯 대왕이 BC 20년경부터 성전을 대대적으로 증축했다. 예수님 시대의 '46년 동안 지은 성전'이 바로 이것이다(요 2:20).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#5CC98A", "route": "", "lat": 31.785474953217662, "lon": 35.28989412872078, "flat": 31.77805, "flon": 35.23545, "fname": "헤롯 성전", "fnote": "BC 20년경부터 헤롯이 대증축한 성전", "hasfine": true, "sz": true, "folder": "3기 · 회복 (포로 → 그리스도)"}, {"n": 70, "lab": "70", "cat": "m", "date": "BC 7경", "title": "가브리엘 — 성전의 사가랴에게", "note": "눅 1:11-19", "desc": "BC 7년경, 성전에서 분향하던 제사장 사가랴에게 천사 가브리엘이 나타나, 늙은 아내 엘리사벳이 엘리야의 심령으로 주의 길을 예비할 아들 요한을 낳을 것이라 알렸다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.810208764551383, "lon": 35.18917200805806, "flat": 31.77805, "flon": 35.23545, "fname": "성소", "fnote": "사가랴가 분향하던 성소에서 가브리엘을 만남(눅 1:11)", "hasfine": true, "sz": true, "folder": "3기 · 회복 (포로 → 그리스도)"}, {"n": 71, "lab": "71", "cat": "m", "date": "BC 6경", "title": "가브리엘 — 나사렛의 마리아에게", "note": "눅 1:26-38", "desc": "BC 6년경, 천사 가브리엘이 갈릴리 나사렛의 처녀 마리아에게 나타나 '성령이 네게 임하시고… 나실 바 거룩한 이는 하나님의 아들이라'며 예수님의 잉태를 알렸다.", "place": "나사렛", "pnote": "수태고지 교회 기준", "col": "#C78BE8", "route": "", "lat": 32.6996, "lon": 35.3035, "flat": 32.6996, "fl 의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "", "lat": 31.72194286643085, "lon": 35.271599120835965, "flat": 31.7765, "flon": 35.2368, "fname": "왕궁 구역(추정)", "fnote": "느부갓네살이 세운 허수아비 왕의 즉위 장소", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.01, "lab": "D10", "cat": "d", "date": "BC 589경", "title": "시드기야의 배반", "note": "왕하 24:20; 렘 52:3; 겔 17:13-19", "desc": "BC 589년경, 시드기야가 하나님의 이름으로 한 맹세를 깨고 애굽을 의지해 바벨론을 배반했다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "", "lat": 31.8450149350354, "lon": 35.24681890840702, "flat": 31.7765, "flon": 35.2368, "fname": "왕궁 구역(추정)", "fnote": "애굽과 손잡고 바벨론에 반기를 든 결정이 내려진 곳", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.02, "lab": "D11", "cat": "d", "date": "BC 588.1.15 (시드기야 9년 10월 10일)", "title": "예루살렘 포위 시작", "note": "왕하 25:1; 렘 39:1; 52:4; 겔 24:1-2", "desc": "BC 588년 1월 15일, 느부갓네살이 모든 군대를 이끌고 와서 예루살렘 둘레에 토성을 쌓고 포위했다. 바벨론의 에스겔도 같은 날을 기록했다. 왕은 시리아의 립나에 본진을 두었다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "바벨론 → 마리(유프라테스) → 갈그미스 → 하맛 → 립나 → 하솔 → 예루살렘", "lat": 31.73582494096798, "lon": 35.180949844960374, "flat": 31.7838, "flon": 35.2312, "fname": "북쪽 바벨론 진영(추정)", "fnote": "토성을 쌓고 포위를 시작한 곳 — 예루살렘이 가장 취약한 북쪽(추정)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.03, "lab": "D12", "cat": "d", "date": "BC 588~586 (포위 중)", "title": "감옥의 예레미야, 에벳멜렉 구원 약속", "note": "렘 39:15-18; 38:7-13", "desc": "포위가 이어지던 중, 궁중 감옥 뜰에 갇힌 예레미야에게 하나님이 구스 사람 에벳멜렉을 위한 말씀을 주셨다. 그는 진흙 구덩이에서 예레미야를 건져낸 사람이었다. '네가 나를 신뢰하였으니 칼에 죽지 않고 살리라.'", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "", "lat": 31.77240998679753, "lon": 35.30513968561555, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "예레미야가 갇혀 있던 궁중 감옥 뜰 — 에벳멜렉에게 약속이 임함(렘 39:15)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.04, "lab": "D13", "cat": "d", "date": "BC 586.7.18 (11년 4월 9일)", "title": "기근, 그리고 성벽이 뚫림", "note": "왕하 25:2-4; 렘 39:2-3; 52:5-7", "desc": "BC 586년 7월 18일, 18개월 포위 끝에 성 안의 식량이 다 떨어지고 성벽이 뚫렸다. 바벨론 대신들이 들어와 중문에 앉았다—네르갈사레셀, 삼갈느보, 살스김(이 이름이 새겨진 바벨론 토판이 2007년 확인됨).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "", "lat": 31.830151349157, "lon": 35.18712312094868, "flat": 31.7822, "flon": 35.2318, "fname": "북쪽 성벽의 뚫린 곳(추정)", "fnote": "BC 586.7.18 성벽이 뚫리고 바벨론 대신들이 '중문'에 앉음(렘 39:3) — 정확 위치는 추정", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.05, "lab": "D14", "cat": "d", "date": "BC 586.7.18 밤", "title": "유다 군대의 야간 도주 — 시드기야도 함께", "note": "왕하 25:4; 렘 39:4; 52:7", "desc": "그날 밤, 바벨론 군대가 성을 에워싸고 있는데도 유다 군대가 왕의 동산 곁 '두 성벽 사이의 문'으로 빠져나가 요단 계곡(아라바) 쪽으로 도망했다. 시드기야 왕도 함께였다(렘 39:4).", "place": "아라바 길(광야)", "pnote": "예루살렘에서 여리고·요단 계곡으로 내려가는 광야 길 위 임의 지점 — 도주 방향 표시용", "col": "#FF8C42", "route": "예루살렘 → 왕의 동산(두 성벽 사이 문) → 베다니 길(감람산 동편) → 아라바 길(광야)", "lat": 31.8, "lon": 35.35, "flat": 31.8, "flon": 35.35, "fname": "여리고 가는 광야길", "fnote": "예루살렘에서 아라바(요단 계곡) 쪽으로 내려가는 옛길 — 개략", "hasfine": true, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.06, "lab": "D15", "cat": "d", "date": "BC 586.7월 하순", "title": "여리고 평지에서 시드기야 생포", "note": "왕하 25:5; 렘 39:5; 52:8", "desc": "바벨론 군대가 뒤쫓아와 여리고 평지에서 시드기야를 사로잡았고, 그의 군대는 뿔뿔이 흩어졌다. 여리고는 이스라엘이 처음 가나안에 들어와 무너뜨린 성이었다.", "place": "여리고 평지", "pnote": "여리고 남동쪽 요단 평지 — 시드기야가 붙잡힌 곳(대략)", "col": "#FF8C42", "route": "아라바 길(광야) → 여리고 평지", "lat": 31.843, "lon": 35.495, "flat": 31.843, "flon": 35.495, "fname": "여리고 평지(요단 쪽)", "fnote": "시드기야가 붙잡힌 곳(왕하 25:5) — 여리고 성터에서 동쪽 평지", "hasfine": true, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.07, "lab": "D16", "cat": "d", "date": "BC 586.7~8월", "title": "립나의 심판 — 아들들의 죽음, 두 눈이 뽑힘", "note": "왕하 25:6-7; 렘 39:5-7; 52:9-11", "desc": "시드기야는 하맛 땅 립나로 끌려가 느부갓네살 앞에서 심문을 받았다. 그의 눈앞에서 아들들과 유다의 대신들이 처형되었고, 그 후 그의 두 눈이 뽑혔다.", "place": "립나", "pnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "col": "#FF8C42", "route": "여리고 평지 → 벧산 → 하솔 → 립나", "lat": 34.42480555816661, "lon": 36.50785127541351, "flat": 34.41703773159028, "flon": 36.51633130314223, "fname": "립나", "fnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 51.07, "lab": "D16", "cat": "d", "date": "BC 586 이후", "title": "시드기야, 바벨론 감옥에서 죽을 때까지", "note": "렘 52:11; 34:3; 겔 12:13", "desc": "쇠사슬에 묶인 시드기야는 바벨론으로 끌려가 죽는 날까지 감옥에 갇혔다. '바벨론 왕의 눈을 보리라'(렘 34:3)와 '그 땅을 보지 못하리라'(겔 12:13)가 둘 다 이루어졌다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF8C42", "route": "립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.50822062028693, "lon": 44.406273908280525, "flat": 32.535225859178624, "flon": 44.42029057951169, "fname": "바벨론", "fnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.01, "lab": "D17", "cat": "d", "date": "BC 586.8.14 (19년 5월 7일 · 렘 52:12은 10일=8.17)", "title": "★ 성전이 불타던 날", "note": "왕하 25:8-10; 렘 39:8; 52:12-14", "desc": "경호대장 느부사라단이 예루살렘에 와서 여호와의 성전과 왕궁, 모든 집과 큰 건물을 불사르고 성벽을 헐었다. 렘 52:12은 10일로 기록(7일 도착·10일 방화로 보기도 함). 솔로몬 성전이 선 지 약 370년 만이었고, 유대인은 지금도 아브월 9일에 금식하며 이날을 기억한다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "립나 → 하솔 → 예루살렘", "lat": 31.70610138474024, "lon": 35.235846543029474, "flat": 31.77805, "flon": 35.23545, "fname": "성전산", "fnote": "여호와의 성전·왕궁·모든 집이 불탄 자리(왕하 25:9)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.02, "lab": "D18", "cat": "d", "date": "BC 586.8월", "title": "성전 기구 약탈 — 놋기둥·놋바다·놋소", "note": "왕하 25:13-17; 렘 52:17-23", "desc": "솔로몬이 만든 놋기둥 두 개(높이 8.1m, 둘레 5.4m, 속이 빈 기둥, 석류 장식 각 100개), 놋바다와 그것을 받친 놋소 열두 마리, 놋받침을 깨뜨려 가져갔다. 놋이 너무 많아 무게를 달 수 없었다. 기둥머리 높이는 왕하 3규빗, 렘 5규빗으로 다르게 적혀 있다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF8C42", "route": "예루살렘 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.54805249508406, "lon": 44.452778195656535, "flat": 31.77805, "flon": 35.23545, "fname": "성전산", "fnote": "놋기둥(야긴과 보아스)·놋바다·놋소를 깨뜨려 가져간 자리(왕하 25:13)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.03, "lab": "D19", "cat": "d", "date": "BC 586.8월", "title": "남은 백성 포로 — 가장 가난한 자만 남음", "note": "왕하 25:11-12; 렘 39:9-10; 52:15-16, 29", "desc": "느부사라단이 성에 남은 백성과 항복한 사람들을 포로로 끌고 갔다. 포로들은 예루살렘 북쪽 라마에 모였다가 떠났다(렘 40:1). 가장 가난한 사람들만 남겨 포도원과 밭을 맡겼다. 렘 52:29은 이때 예루살렘 사람 832명이라고 기록한다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF8C42", "route": "예루살렘 → 라마 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.55012501769958, "lon": 44.387619016103095, "flat": 32.5421, "flon": 44.4209, "fname": "이슈타르 문 일대", "fnote": "포로 행렬이 도착한 바벨론 중심부(근사)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.04, "lab": "D20", "cat": "d", "date": "BC 586.8월", "title": "예레미야, 궁중 감옥에서 풀려남 · 에벳멜렉 구원", "note": "렘 39:11-14", "desc": "느부갓네살이 예레미야를 잘 돌보라고 명령했고, 바벨론 대신들이 그를 궁중 감옥에서 꺼내 그달랴에게 맡겼다. 에벳멜렉에게 하신 구원의 약속도 이루어졌다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF8C42", "route": "", "lat": 31.832229439066015, "lon": 35.284369417256066, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "느부사라단의 사람들이 예레미야를 감옥 뜰에서 꺼낸 곳(렘 39:14)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.05, "lab": "D21", "cat": "d", "date": "BC 586.8월", "title": "라마에서 쇠사슬이 풀림 → 미스바로", "note": "렘 40:1-6", "desc": "예레미야는 다시 포로 행렬에 섞여 쇠사슬에 묶인 채 라마까지 끌려갔다. 느부사라단이 그를 풀어 주며 '네 하나님이 말씀하신 대로 행하셨다'고 말하고, 양식과 선물을 주어 보냈다. 예레미야는 미스바의 그달랴에게 갔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "라마 → 미스바", "lat": 31.887, "lon": 35.217, "flat": 31.887, "flon": 35.217, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.06, "lab": "D22", "cat": "d", "date": "BC 586.8월", "title": "지도자들 처형 — '유다가 본토에서 떠났더라'", "note": "왕하 25:18-21; 렘 52:24-27", "desc": "대제사장 스라야, 부제사장 스바냐, 성전 문지기 세 명, 군 지휘관, 왕의 보좌관(왕하 5명·렘 7명), 징집 서기관, 백성 60명이 립나로 끌려가 처형되었다. '이와 같이 유다가 사로잡혀 본토에서 떠났더라'(왕하 25:21).", "place": "립나", "pnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "col": "#FF8C42", "route": "예루살렘 → 하솔 → 립나", "lat": 34.39979452599794, "lon": 36.518184906988886, "flat": 34.41599560524991, "flon": 36.51676187112454, "fname": "립나", "fnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.07, "lab": "D23", "cat": "d", "date": "BC 586", "title": "그달랴, 유다 총독이 됨", "note": "왕하 25:22; 렘 40:5", "desc": "느부갓네살이 사반의 손자, 아히감의 아들 그달랴를 총독으로 세워 남은 사람들을 다스리게 했다. 그의 집안은 예레미야를 보호했던 가문이었다(렘 26:24).", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "", "lat": 31.895105558166613, "lon": 35.208151275413506, "flat": 31.888, "flon": 35.2175, "fname": "미스바 성문 지대", "fnote": "느부갓네살이 세운 총독 그달랴의 관저", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.08, "lab": "D24", "cat": "d", "date": "BC 586 여름~가을", "title": "지휘관들이 모임 — 그달랴의 맹세", "note": "왕하 25:23-24; 렘 40:7-10", "desc": "들에 숨어 있던 지휘관들—이스마엘, 요하난, 스라야, 야아사냐—이 미스바로 왔다. 그달랴는 '바벨론 왕을 섬기면 무사할 것이니 이 땅에 정착해 포도주와 여름 과일과 기름을 거두라'고 맹세했다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "", "lat": 31.87009452599794, "lon": 35.218484906988884, "flat": 31.888, "flon": 35.2175, "fname": "미스바 성문 지대", "fnote": "지휘관들이 그달랴 앞에 모인 곳(렘 40:7-10)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.09, "lab": "D25", "cat": "d", "date": "BC 586 가을", "title": "흩어진 유대인들의 귀환과 풍성한 수확 (모압)", "note": "렘 40:11-12", "desc": "모압·암몬·에돔 등 각지로 흩어졌던 유대인들이 그달랴 소식을 듣고 돌아왔다. 그해 그들은 포도주와 여름 과일을 아주 많이 거두었다—심판 뒤에 주어진 짧은 회복의 계절이었다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "모압 → 여리고 → 미스바", "lat": 31.903496076774257, "lon": 35.22964434462745, "flat": 31.88768733653226, "flon": 35.21752684769281, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.09, "lab": "D25", "cat": "d", "date": "BC 586 가을", "title": "암몬에서 돌아옴", "note": "렘 40:11", "desc": "암몬 땅에 피했던 유대인들도 돌아왔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "암몬(랍바) → 여리고 → 미스바", "lat": 31.882816157250648, "lon": 35.19336749146094, "flat": 31.886825673218777, "flon": 35.21601531214421, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.09, "lab": "D25", "cat": "d", "date": "BC 586 가을", "title": "에돔에서 돌아옴", "note": "렘 40:11", "desc": "에돔 땅에 피했던 유대인들도 돌아왔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "에돔(보스라) → 헤브론 → 미스바", "lat": 31.872602237765587, "lon": 35.2396429777777, "flat": 31.886400093240233, "flon": 35.2179434574074, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.1, "lab": "D26", "cat": "d", "date": "BC 586 가을", "title": "요하난의 경고, 믿지 않은 그달랴", "note": "렘 40:13-16", "desc": "요하난이 '암몬 왕 바알리스가 당신을 죽이려고 이스마엘을 보냈다'고 경고하며 몰래 이스마엘을 죽이겠다고 했지만, 그달랴는 믿지 않고 막았다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "", "lat": 31.915384425824357, "lon": 35.209362960611486, "flat": 31.8872, "flon": 35.2168, "fname": "그달랴 관저(추정)", "fnote": "요하난이 몰래 경고한 곳(렘 40:13-16)", "hasfine": true, "sz": true, "folder": "유다 멸망 상세 (D1–D38)"}, {"n": 52.11, "lab": "D27", "cat": "d", "date": "BC 586.10월경 (식사 중 · 582년설도)", "title": "그달랴 암살", "note": "왕하 25:25; 렘 41:1-3", "desc": "그해 일곱째 달(티쉬리월), 왕족 이스마엘이 부하 10명과 함께 미스바에서 그달랴와 식사하던 중 일어나 그를 칼로 죽이고, 함께 있던 유대인과 바벨론 군인들까지 죽였다. 유대인은 지금도 티쉬리월 3일을 '그달랴 금식일'로 지킨다. BC 582년으로 보는 학자들도 있다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#FF8C42", "route": "암몬(랍바) → 여리고 → 미스바", "l   const p=map.project(b.getCenter(),z).add([0,Math.round(map.getSize().y*0.12)]);return {c:map.unproject(p,z),z,b}}
function camPlan(n,i){const cm=$('cam').value;if(cm==='fixed')return {k:'fixed'};
  const its=stepItems(n);if(!its.length)return {k:'fixed'};
  if(cm==='cum'){const pts=[];items.forEach(it=>{if(vis[it.cat]&&it.n>=s0&&it.n<=n)pts.push(...ptsOf(it,false))});if(!pts.length)return {k:'fixed'};return {k:'one',t:fitTarget(L.latLngBounds(pts),3.5,10.5)}}
  const coarse=boundsOf(its.map(it=>ptsOf(it,false)));
  const fineMk=its.filter(it=>it.type==='m'&&it.d.sz),tails=its.filter(it=>it.type==='p'&&it.d.fmode==='tail');
  const detail=fineMk.length>0||tails.length>0||its.some(it=>it.type==='p'&&it.d.detail);
  const local=diagM(coarse)<25000;
  if(local&&detail)return {k:'one',t:fitTarget(boundsOf(its.map(it=>ptsOf(it,true))),10,17.5,L.point(120,260))};
  let cb=coarse;if(i>0){const pb=boundsOf(stepItems(seq[i-1]).map(it=>ptsOf(it,false)));if(pb&&pb.getCenter().distanceTo(coarse.getCenter())<120000)cb=L.latLngBounds([coarse.getSouthWest(),coarse.getNorthEast(),pb.getSouthWest(),pb.getNorthEast()])}
  const t1=fitTarget(cb,3.5,local?10:10.5);
  if(fineMk.length||tails.length){const fl=[];fineMk.forEach(it=>fl.push([[it.d.flat,it.d.flon]]));tails.forEach(it=>fl.push(it.d.fpts.slice(Math.max(0,it.d.tailStart))));
    return {k:'two',t1,t2:fitTarget(boundsOf(fl),13,17.5,L.point(120,260)),tails}}
  return {k:'one',t:t1}}
function moveCam(t,dur){if(!t)return false;const cz=map.getZoom();
  if(map.project(map.getCenter(),t.z).distanceTo(map.project(t.c,t.z))<30&&Math.abs(cz-t.z)<0.1)return false;
  if($('cam').value==='auto'&&map.getBounds().pad(-0.08).contains(t.b)&&Math.abs(t.z-cz)<0.75&&t.z<12&&cz<12)return false;
  try{map.flyTo(t.c,t.z,{duration:dur})}catch(e){map.setView(t.c,t.z);return false}return true}
function whenMoved(moved,cb,dur){let done=false;const go=()=>{if(done)return;done=true;cb()};
  if(moved){map.once('moveend',()=>setTimeout(go,150));setTimeout(go,dur*1000+900)}else go()}
// ---------- 자막 ----------
function caption(n){const ms=stepItems(n).filter(it=>it.type==='m').map(it=>it.d);const c=$('cap');
  if(!ms.length){c.classList.remove('show');return}
  const m0=ms[0];c.querySelector('.big').textContent=m0.lab;c.querySelector('.big').style.background=m0.col;
  c.querySelector('.dt').textContent=m0.date+' · '+[...new Set(ms.map(m=>m.place))].join(' / ');
  c.querySelector('.tx').innerHTML=ms.map(m=>`<div class="tt">${m.title}</div><div class="ds">${m.desc}</div>`).join('');
  c.querySelector('.nt').textContent='📖 '+[...new Set(ms.map(m=>m.note))].join(' · ');
  const seen=new Set();c.querySelector('.pl').innerHTML=ms.filter(m=>{const key=m.place+m.route+m.fname;if(seen.has(key))return false;seen.add(key);return true}).map(m=>`📍 <b>${m.place}</b> — ${m.pnote}`+(m.hasfine?`<br>🔎 <b>정밀 위치: ${m.fname}</b> — ${m.fnote}`:'')+(m.route?`<br><span style="color:#888">경로: ${m.route}</span>`:'')).join('<br>');
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}
// ---------- 경로 그리기 ----------
function drawLine(pts,col,ms,tk,cb){const pl=L.polyline([pts[0]],{color:col,weight:5,opacity:1}).addTo(map);anims.push(pl);const t0=performance.now();
  (function step(t){if(tk!==token){map.removeLayer(pl);return}const k=Math.min(1,(t-t0)/ms),upto=Math.max(1,Math.round(k*(pts.length-1)));pl.setLatLngs(pts.slice(0,upto+1));
    if(k<1)requestAnimationFrame(step);else{map.removeLayer(pl);cb()}})(t0)}
function reveal(n,tk,pathMs,cb){if(tk!==token)return;const ps=stepItems(n).filter(it=>it.type==='p');let left=ps.length;
  if(!left){hideP=null;render(false);cb();return}
  ps.forEach(it=>{const pts=(curFine&&it.d.fpts&&!tailSet.has(it))?it.d.fpts:it.d.pts;
    const ms=pathMs*Math.min(1.6,Math.max(0.7,pts.length/21));
    drawLine(pts,it.d.col,ms,tk,()=>{if(--left===0){hideP=null;render(false);cb()}})})}
function tailReveal(n,tk,ms,cb){if(tk!==token)return;const ps=stepItems(n).filter(it=>it.type==='p'&&it.d.fmode==='tail');let left=ps.length;
  if(!left){cb();return}
  ps.forEach(it=>{const pts=it.d.fpts.slice(it.d.tailStart);drawLine(pts,it.d.col,Math.max(500,ms),tk,()=>{tailSet.delete(it);setPath(it,it.d.fpts);if(--left===0)cb()})})}
function numbersInRange(){return [...new Set(items.filter(it=>vis[it.cat]&&it.n>=s0&&it.n<=s1).map(it=>it.n))].sort((a,b)=>a-b)}
function LB(n){const m=items.find(it=>it.type==='m'&&it.n===n);return m?m.d.lab:n}
function showAt(i,manual){const n=seq[i];cur=n;si=i+1;const iv=Math.max(300,+$('iv').value||2500);
  const tk=++token;anims.forEach(a=>map.removeLayer(a));anims=[];tailSet.clear();hideM=n;hideP=n;render(false);
  caption(n);items.forEach(it=>{if(it.type==='m')it.el.classList.toggle('act',it.n===n)});
  const a=items.find(it=>it.type==='m'&&it.n===n&&vis[it.cat]);if(a)a.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstChild.style.width=((i+1)/seq.length*100)+'%';
  $('st').textContent=`${manual?'수동':'재생 중'} — ${LB(n)} (${i+1}/${seq.length})`;
  map.invalidateSize();const plan=camPlan(n,i);planTwo=plan.k==='two';
  const camDur=Math.min(1.5,Math.max(0.4,iv/1000*0.3)),pathMs=Math.min(1700,Math.max(250,iv*0.35));
  const finish=()=>{if(tk!==token)return;hideM=null;render(false)};
  const phaseB=()=>{if(tk!==token)return;plan.tails.forEach(it=>tailSet.add(it));
    const mv=moveCam(plan.t2,camDur*1.3);
    whenMoved(mv,()=>{if(tk!==token)return;applyFine(true,true,true);tailReveal(n,tk,pathMs*0.8,finish)},camDur*1.3)};
  const afterPaths=()=>{if(tk!==token)return;if(plan.k==='two')phaseB();else finish()};
  const mv=moveCam(plan.k==='two'?plan.t1:plan.t,camDur);
  whenMoved(mv,()=>reveal(n,tk,pathMs,afterPaths),camDur)}
function tick(){if(paused)return;if(si>=seq.length){$('st').textContent=`완료 — ${LB(seq[0])}~${LB(seq[seq.length-1])}`;timer=null;return}
  const iv=Math.max(300,+$('iv').value||2500);showAt(si,false);timer=setTimeout(tick,iv+(planTwo?Math.min(2500,iv*0.6):0))}
function initSeq(){s0=Math.max(KMIN,Math.min(KMAX,+$('s0').value||KMIN));s1=Math.max(KMIN,Math.min(KMAX,+$('s1').value||KMAX));if(s0>s1)[s0,s1]=[s1,s0];mode='play';seq=numbersInRange();si=0;cur=s0-1}
function manualStep(dir){clearTimeout(timer);timer=null;
  if(mode!=='play'){initSeq();paused=true;if(!seq.length)return;showAt(dir>0?0:seq.length-1,true);return}
  paused=true;const t=si-1+dir;if(t<0||t>=seq.length){$('st').textContent=`${t<0?'처음':'마지막'} 단계입니다 — ${LB(cur)}`;return}showAt(t,true)}
function startFrom(n){clearTimeout(timer);timer=null;$('s0').value=n;if((+$('s1').value||KMAX)<n)$('s1').value=KMAX;
  initSeq();paused=true;if(!seq.length)return;showAt(0,true);$('st').textContent=`${LB(n)}번부터 시작 — Next ▶ 로 이어가기 (1/${seq.length})`}
$('bNext').onclick=()=>manualStep(1);$('bPrev').onclick=()=>manualStep(-1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight'){manualStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){manualStep(-1);e.preventDefault()}
  else if(e.key===' '){(mode==='play'&&!paused)?$('bPause').click():$('bPlay').click();e.preventDefault()}});
$('bPlay').onclick=()=>{if(mode==='play'&&paused){paused=false;$('st').textContent='재생 재개';tick();return}if(mode==='play'&&timer)return;initSeq();paused=false;render(false);tick()};
$('bPause').onclick=()=>{if(mode!=='play')return;paused=true;clearTimeout(timer);timer=null;$('st').textContent=`일시정지 — ${LB(cur)}`};
$('bStop').onclick=()=>{clearTimeout(timer);timer=null;paused=false;mode='all';token++;hideM=hideP=null;tailSet.clear();anims.forEach(a=>map.removeLayer(a));anims=[];
  $('cap').classList.remove('show');$('prog').firstChild.style.width='0';items.forEach(it=>it.el&&it.el.classList.remove('act'));
  render(true);$('st').textContent='정지 — 전체 보기'};
render(false);map.fitBounds([[27.5, 29], [37.5, 49]]);updZl();
</script></body></html>
