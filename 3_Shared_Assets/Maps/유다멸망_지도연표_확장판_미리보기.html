님의 족보는 이 줄로 이어진다(마 1:12).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.732006284209927, "lon": 35.229452785133844, "flat": 31.77805, "flon": 35.23545, "fname": "성전 앞", "fnote": "무화과 두 광주리가 놓였던 성전 앞(렘 24:1)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 23.0, "lab": "23", "cat": "jer", "date": "BC 594/593 (시드기야 4년 5월)", "title": "나무 멍에를 꺾자 쇠 멍에 — 거짓 평안의 하나냐", "note": "렘 27–28", "desc": "예레미야가 목에 줄과 멍에를 메고 '바벨론 왕을 섬기면 살리라'(27:12). 선지자 하나냐가 성전에서 그 멍에를 꺾으며 '2년 안에'라고 외쳤다. 하나님: '나무 멍에를 꺾었으나 쇠 멍에를 만들었느니라'(28:13). 하나냐는 그 해 일곱째 달에 죽었다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.809055043181353, "lon": 35.27208494652634, "flat": 31.77805, "flon": 35.23545, "fname": "성전", "fnote": "하나냐가 멍에를 꺾은 성전 뜰(렘 28:1, 10)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 24.0, "lab": "24", "cat": "jer", "date": "BC 594 무렵", "title": "포로들에게 보낸 편지 — '평안이요 재앙이 아니니라'", "note": "렘 29:1-14", "desc": "바벨론의 포로들에게: '집을 짓고… 그 성읍의 평안을 구하고 그를 위하여 여호와께 기도하라'(29:5-7). '칠십 년이 차면 내가 너희를 돌보고… 돌아오게 하리라. 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라… 미래와 희망을'(29:10-11).", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#C78BE8", "route": "예루살렘 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.55289607677426, "lon": 44.43354434462746, "flat": 32.53708733653226, "flon": 44.421426847692814, "fname": "바벨론", "fnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "hasfine": false, "sz": false, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 25.0, "lab": "25", "cat": "jer", "date": "BC 594/593 (시드기야 4년)", "title": "스라야 — 바벨론 심판의 책을 유브라데에 던짐", "note": "렘 51:59-64", "desc": "바룩의 형제 스라야가 시드기야와 함께 바벨론에 갈 때, 예레미야는 바벨론 심판의 말씀을 적은 책을 주며 '읽기를 다한 후에 책에 돌을 매어 유브라데 강 속에 던지라… 바벨론이 이같이 몰락하여 다시 일어서지 못하리니'(51:63-64)라고 했다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#C78BE8", "route": "예루살렘 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.53221615725065, "lon": 44.397267491460944, "flat": 32.53622567321878, "flon": 44.41991531214421, "fname": "바벨론", "fnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "hasfine": false, "sz": false, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 26.0, "lab": "26", "cat": "eze", "date": "BC 593.7.31 (여호야긴 포로 5년 4월 5일)", "title": "에스겔의 소명 — 그발 강 가에 나타난 움직이는 보좌", "note": "겔 1–3", "desc": "포로 된 제사장 에스겔에게 하늘이 열렸다. 바퀴 안의 바퀴, 사방으로 가는 보좌 — 하나님은 예루살렘 성전에만 매인 분이 아니었다. 두루마리에는 '애가와 애곡과 재앙'(2:10), 그런데 먹으니 '달기가 꿀 같더라'(3:3). '내가 너를 이스라엘 족속의 파수꾼으로 세웠으니'(3:17).", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.13, "lon": 45.23, "flat": 32.13, "flon": 45.23, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 27.0, "lab": "27", "cat": "eze", "date": "BC 593–592", "title": "토판 위의 포위 모형 · 저울에 달아 먹는 떡", "note": "겔 4–5", "desc": "에스겔이 토판에 예루살렘을 그리고 토성과 진과 공성퇴를 세워 포위 모형을 만들었다(4:1-3). 떡을 저울에 달아 먹고(4:10, 16 → 왕하 25:3), 머리털을 셋으로 나눠 태우고 치고 날렸다. 그러나 '조금을 네 옷자락에 싸고'(5:3) — 남은 자는 하나님이 품에 싸 두신다.", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.138105558166615, "lon": 45.221151275413504, "flat": 32.13033773159028, "flon": 45.22963130314223, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 28.0, "lab": "28", "cat": "eze", "date": "BC 592.9.18 (6년 6월 5일)", "title": "환상 중 예루살렘으로 — 성전의 우상, 그리고 영광이 떠남", "note": "겔 8–11", "desc": "에스겔은 환상 중 예루살렘 성전으로 옮겨졌다. 어두운 방의 70 장로, 담무스를 위해 우는 여인들, 성전을 등지고 태양에 절하는 25명. '탄식하며 우는 자의 이마에 표를 그리라'(9:4), '내 성소에서 시작할지니라'(9:6). 그리고 여호와의 영광이 문지방 → 동문 → '성읍 동쪽 산'으로 떠났다(10:18-19; 11:23). 성전이 불타기 6년 전이다. 그래도 '내가 잠깐 그들에게 성소가 되리라'(11:16).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#3DC1C9", "route": "그발 강(델아빕) → 예루살렘", "lat": 31.780113391179647, "lon": 35.18596371518856, "flat": 31.7788, "flon": 35.245, "fname": "성읍 동쪽 산(감람산)", "fnote": "영광이 떠나 머문 '성읍 동쪽 산'(겔 11:23) — 감람산으로 보는 전통", "hasfine": true, "sz": true, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 29.0, "lab": "29", "cat": "eze", "date": "BC 592–591", "title": "행장을 꾸려 성벽을 뚫고 — 시드기야의 도주를 미리 연기", "note": "겔 12:1-16; 17:11-21", "desc": "에스겔이 낮에 포로의 짐을 내놓고, 저물 때 손으로 성벽을 뚫고, 어두울 때 얼굴을 가리고 나갔다. '그 중에 왕은 어두울 때에 어깨에 행장을 메고 나가며… 바벨론에 이르리니 그가 거기에서 죽으려니와 그 땅을 보지 못하리라'(12:12-13). 6년 뒤 왕하 25:4-7에서 그대로 일어난다.", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.113094525997944, "lon": 45.23148490698888, "flat": 32.129295605249915, "flon": 45.23006187112453, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 30.0, "lab": "30", "cat": "eze", "date": "BC 591.8.14 (7년 5월 10일) 이후", "title": "'내 이름을 위하여' · 무너진 데를 막아 설 사람을 찾다가", "note": "겔 16:60; 18:23, 32; 20:9-22; 22:30", "desc": "광야에서부터 멸할 만했지만 '내 이름을 위하여… 아껴서' 참으셨다(20:9-22). '내가 어찌 악인이 죽는 것을 조금인들 기뻐하랴'(18:23). '이 땅을 위하여 성을 쌓으며 성 무너진 데를 막아 서서 나로 하여금 멸하지 못하게 할 사람을 내가 그 가운데에서 찾다가 찾지 못하였으므로'(22:30). 그래도 '어렸을 때에 너와 세운 언약을 기억하고 영원한 언약을 세우리라'(16:60).", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.14649607677426, "lon": 45.24264434462745, "flat": 32.13068733653226, "flon": 45.23052684769281, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 31.0, "lab": "31", "cat": "king", "date": "BC 589경", "title": "시드기야의 배반", "note": "왕하 24:20; 렘 52:3; 겔 17:13-19", "desc": "BC 589년경, 시드기야가 하나님의 이름으로 한 맹세를 깨고 애굽을 의지해 바벨론을 배반했다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#4FA3E0", "route": "", "lat": 31.742211809387076, "lon": 35.271511463201186, "flat": 31.7765, "flon": 35.2368, "fname": "왕궁 구역(추정)", "fnote": "애굽과 손잡고 바벨론에 반기를 든 결정이 내려진 곳", "hasfine": true, "sz": true, "folder": "유다 왕실"}, {"n": 32.0, "lab": "32", "cat": "text", "date": "BC 588.1.15 (시드기야 9년 10월 10일)", "title": "예루살렘 포위 시작", "note": "왕하 25:1; 렘 39:1; 52:4; 겔 24:1-2", "desc": "BC 588년 1월 15일, 느부갓네살이 모든 군대를 이끌고 와서 예루살렘 둘레에 토성을 쌓고 포위했다. 바벨론의 에스겔도 같은 날을 기록했다. 왕은 시리아의 립나에 본진을 두었다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF4D4D", "route": "바벨론 → 마리(유프라테스) → 갈그미스 → 하맛 → 립나 → 하솔 → 예루살렘", "lat": 31.83034925460301, "lon": 35.232947370099374, "flat": 31.7838, "flon": 35.2312, "fname": "북쪽 바벨론 진영(추정)", "fnote": "토성을 쌓고 포위를 시작한 곳 — 예루살렘이 가장 취약한 북쪽(추정)", "hasfine": true, "sz": true, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 33.0, "lab": "33", "cat": "eze", "date": "BC 588.1.15 (9년 10월 10일) — 같은 날", "title": "같은 날 바벨론에서 — '오늘의 이름을 기록하라'", "note": "겔 24:1-14", "desc": "예루살렘 포위가 시작된 바로 그날, 1,300km 떨어진 그발 강 가의 에스겔에게: '인자야 너는 날짜 곧 오늘의 이름을 기록하라 바벨론 왕이 오늘 예루살렘에 가까이 왔느니라'(24:2). 소식이 오가려면 넉 달이 넘게 걸리는 거리였다. 그리고 녹슨 가마의 비유 — 고관들이 자랑하던 '성읍은 가마요 우리는 고기'(11:3)가 뒤집힌다.", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.125816157250654, "lon": 45.20636749146094, "flat": 32.12982567321878, "flon": 45.229015312144206, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 34.0, "lab": "34", "cat": "eze", "date": "BC 588 무렵 (본문에 날짜 없음)", "title": "에스겔 아내의 죽음 — '네 눈에 기뻐하는 것'", "note": "겔 24:15-27", "desc": "'인자야 내가 네 눈에 기뻐하는 것을 한 번 쳐서 빼앗으리니 너는 슬퍼하거나 울지 말며'(24:16). 저녁에 아내가 죽었다. 뜻: '내 성소는… 너희 눈의 기쁨이요 너희 마음에 아낌이 되거니와 내가 더럽힐 것'(24:21). ※ 24:1의 같은 날인지는 본문이 확정하지 않는다.", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.11560223776559, "lon": 45.2526429777777, "flat": 32.129400093240235, "flon": 45.2309434574074, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 35.0, "lab": "35", "cat": "jer", "date": "BC 588 (포위 초)", "title": "시드기야의 대표단 — '생명의 길과 사망의 길'", "note": "렘 21:1-10", "desc": "'여호와께서 혹시 그의 모든 기적으로 우리를 도와…'(21:2). 대답: '내가 너희 앞에 생명의 길과 사망의 길을 두었노라… 나가서 항복하는 자는 살 것이나'(21:8-9) — 모세가 신 30:15, 19에서 한 바로 그 말.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.73687112847798, "lon": 35.20104624979684, "flat": 31.7765, "flon": 35.2368, "fname": "왕궁 구역(추정)", "fnote": "시드기야가 대표단을 보낸 왕궁", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 36.0, "lab": "36", "cat": "jer", "date": "BC 588", "title": "'라기스와 아세가만 남았음이더라'", "note": "렘 34:1-7 · 라기스 토편 4번", "desc": "예레미야가 시드기야에게 직접: '네 눈은 바벨론 왕의 눈을 볼 것이며… 너는 바벨론으로 가리라'(34:3). 그때 유다의 견고한 성읍 중 '라기스와 아세가… 이것들만 남았음이더라'(34:7). 라기스에서 발굴된 토편 4번: '아세가의 신호는 보이지 않는다' — 아세가가 먼저 무너진 순간의 기록으로 보는 견해가 있다.", "place": "라기스", "pnote": "텔 라기스 유적 기준 — 확실", "col": "#C78BE8", "route": "예루살렘 → 아세가 → 라기스", "lat": 31.565, "lon": 34.849, "flat": 31.565, "flon": 34.849, "fname": "라기스", "fnote": "텔 라기스 유적 기준 — 확실", "hasfine": false, "sz": false, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 37.0, "lab": "37", "cat": "jer", "date": "BC 588", "title": "위기 속의 계약 — 히브리 노비를 해방", "note": "렘 34:8-10", "desc": "포위가 조여 오자 시드기야와 고관과 백성이 성전에서 하나님 앞에 계약을 맺고 노비를 자유롭게 했다. 7년마다 놓아 주라는 율법(신 15:12)을 오랫동안 어기다가 위기 앞에서 지킨 것이다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.785474953217662, "lon": 35.28989412872078, "flat": 31.77805, "flon": 35.23545, "fname": "성전", "fnote": "'내 이름으로 일컬음을 받는 집에서 내 앞에서 계약을 맺었거늘'(렘 34:15)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 38.0, "lab": "38", "cat": "bab", "date": "BC 588/587", "title": "애굽 군대가 오자 포위가 잠시 풀림", "note": "렘 37:5-10; 겔 17:15-17", "desc": "바로(호브라)의 군대가 애굽에서 나오자 바벨론 군대가 잠시 예루살렘을 떠났다. 예레미야: '스스로 속여 말하기를 갈대아인이 반드시 우리를 떠나리라 하지 말라… 다시 와서 이 성을 불사르리라'(37:9-10).", "place": "가사", "pnote": "가사 — 애굽으로 가는 해안길(Via Maris)의 관문", "col": "#E8955F", "route": "애굽(멤피스) → 애굽 국경(펠루시움) → 가사", "lat": 31.504, "lon": 34.464, "flat": 31.504, "flon": 34.464, "fname": "가사", "fnote": "가사 — 애굽으로 가는 해안길(Via Maris)의 관문", "hasfine": false, "sz": false, "folder": "바벨론 (침공·포로)"}, {"n": 39.0, "lab": "39", "cat": "eze", "date": "BC 587.1.7 · 587.4.29", "title": "바벨론에서 같은 때 — '애굽은 갈대 지팡이', '바로의 팔을 꺾었다'", "note": "겔 29:1-16; 30:20-26", "desc": "애굽 구원군이 실패하던 바로 그 무렵, 에스겔은 바벨론에서 선언했다. '애굽은 본래 이스라엘 족속에게 갈대 지팡이라… 의지한즉 네가 부러져서'(29:6-7). '내가 애굽의 바로 왕의 팔을 꺾었더니'(30:21).", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.15838442582436, "lon": 45.222362960611484, "flat": 32.13118268440935, "flon": 45.229681790025474, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 40.0, "lab": "40", "cat": "jer", "date": "BC 588/587 (포위가 풀린 때)", "title": "노비를 다시 끌어옴 — '쪼갠 송아지 사이로 지나며' 맺은 맹세", "note": "렘 34:11-22; 창 15:10, 17", "desc": "포위가 풀리자 그들은 놓아 준 노비를 다시 끌어왔다. 하나님: '송아지를 둘로 쪼개고 그 두 조각 사이로 지나매 내 앞에 언약을 맺었으나… 어긴 그들을'(34:18) — 창 15장 아브라함 언약과 같은 의식. 창 15에서는 하나님 홀로 횃불로 지나가셨다. 여기서는 사람이 지나가고, 사람이 깨뜨렸다. '그들의 시체가 공중의 새와 땅의 짐승의 먹이가 될 것이며'(34:20).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.810208764551383, "lon": 35.18917200805806, "flat": 31.77805, "flon": 35.23545, "fname": "성전", "fnote": "쪼갠 송아지 사이를 지나며 맹세한 곳(렘 34:15, 18)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 41.0, "lab": "41", "cat": "jer", "date": "BC 588/587", "title": "예레미야 체포 — '네가 갈대아인에게 항복하려 하는도다'", "note": "렘 37:11-21", "desc": "포위가 풀린 틈에 베냐민 땅으로 가던 예레미야가 베냐민 문에서 붙잡혀 맞고 웅덩이 감옥에 갇혔다. 시드기야가 비밀히 불러 '여호와께로부터 받은 말씀이 있느냐' 묻자 '있나이다… 왕이 바벨론의 왕의 손에 넘겨지리이다'(37:17). 매일 떡 한 개씩, '성중에 떡이 떨어질 때까지'(37:21).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.721963983044944, "lon": 35.248078627702625, "flat": 31.783, "flon": 35.2368, "fname": "베냐민 문(추정)", "fnote": "예레미야가 붙잡힌 북쪽 성문(렘 37:13)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 42.0, "lab": "42", "cat": "jer", "date": "BC 588~586 (포위 중)", "title": "감옥의 예레미야, 에벳멜렉 구원 약속", "note": "렘 39:15-18; 38:7-13", "desc": "포위가 이어지던 중, 궁중 감옥 뜰에 갇힌 예레미야에게 하나님이 구스 사람 에벳멜렉을 위한 말씀을 주셨다. 그는 진흙 구덩이에서 예레미야를 건져낸 사람이었다. '네가 나를 신뢰하였으니 칼에 죽지 않고 살리라.'", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.82913278711457, "lon": 35.26458312250803, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "예레미야가 갇혀 있던 궁중 감옥 뜰 — 에벳멜렉에게 약속이 임함(렘 39:15)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 43.0, "lab": "43", "cat": "jer", "date": "BC 587 (시드기야 10년 = 느부갓네살 18년)", "title": "갇힌 채 아나돗의 밭을 삼 — '다시 사게 되리라'", "note": "렘 32:1-44; 스 2:23", "desc": "포위된 성 안, 시위대 뜰에 갇힌 예레미야가 사촌 하나멜의 아나돗 밭을 은 17세겔에 샀다. 그를 죽이려 했던 고향이다(11:21). 증서는 토기에 담아 보존(32:14). '사람이 이 땅에서 집과 밭과 포도원을 다시 사게 되리라'(32:15), '내게 할 수 없는 일이 있겠느냐'(32:27), '나를 경외함을 그들의 마음에 두어 나를 떠나지 않게 하고'(32:40). 51년 뒤 '아나돗 사람이 128명' 돌아왔다(스 2:23).", "place": "아나돗", "pnote": "아나타 마을 인근(라스 엘-하루베) 기준 — 통설", "col": "#C78BE8", "route": "예루살렘 → 아나돗", "lat": 31.82110555816661, "lon": 35.25515127541351, "flat": 31.813337731590273, "flon": 35.26363130314223, "fname": "아나돗", "fnote": "아나타 마을 인근(라스 엘-하루베) 기준 — 통설", "hasfine": false, "sz": false, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 44.0, "lab": "44", "cat": "jer", "date": "BC 587 (아직 갇혀 있을 때, 두 번째)", "title": "★ 포위 중의 두 번째 말씀 — 신랑·신부의 소리가 다시, 낮과 밤의 언약", "note": "렘 33:1-26", "desc": "'너는 내게 부르짖으라 내가 네게 응답하겠고'(33:3). 끊어진다던 소리 — '신랑의 소리, 신부의 소리'가 다시 들리리라(33:11). '여호와는 우리의 의'(33:16). '너희가 능히 낮에 대한 나의 언약과 밤에 대한 나의 언약을 깨뜨릴 수 있을진대 내 종 다윗에게 세운 나의 언약도 깨뜨릴 수 있으리라'(33:20-21). 성벽이 무너져 가던 바로 그때, 무너지지 않을 기초를 말씀하셨다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.759811362733867, "lon": 35.17825522117509, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "예레미야가 갇혀 있던 시위대 뜰(렘 33:1)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 45.0, "lab": "45", "cat": "jer", "date": "포위 무렵 (30–31장은 날짜 불명, 32–33장과 한 묶음)", "title": "★ 위로의 책 — 새 언약 '내가 그들의 남편이 되었어도'", "note": "렘 30:1-31:40", "desc": "'책에 기록하라'(30:2). '내가 영원한 사랑으로 너를 사랑하기에'(31:3). 라마의 라헬(31:15). '그를 위하여 내 창자가 들끓으니'(31:20). 그리고 새 언약: '내가 그들의 남편이 되었어도 그들이 내 언약을 깨뜨렸음이라… 나의 법을 그들의 속에 두며… 다시는 그 죄를 기억하지 아니하리라'(31:32-34) — 동사의 주어가 전부 '내가'.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.75248939141503, "lon": 35.290970646279376, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "위로의 책은 포위 중 말씀(32–33장)과 한 묶음으로 놓여 있다", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 46.0, "lab": "46", "cat": "jer", "date": "BC 586 상반기", "title": "마지막 밀담 — '항복하면 이 성이 불사름을 당하지 아니하겠고'", "note": "렘 38:14-28", "desc": "진창 구덩이에서 건져진 예레미야를 시드기야가 성전 셋째 문으로 비밀히 불렀다. '네가 만일… 항복하면 네 생명이 살겠고 이 성이 불사름을 당하지 아니하겠고'(38:17). 끝까지 열려 있던 문. 시드기야의 대답: '나는… 두려워하노라… 조롱할까 하노라'(38:19). 예레미야: '네 발이 진흙에 빠짐을 보고'(38:22).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.835595810112117, "lon": 35.21127051969994, "flat": 31.77805, "flon": 35.23545, "fname": "성전 셋째 문(추정)", "fnote": "시드기야가 예레미야를 비밀히 만난 곳(렘 38:14)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 47.0, "lab": "47", "cat": "text", "date": "BC 586.7.18 (11년 4월 9일)", "title": "기근, 그리고 성벽이 뚫림", "note": "왕하 25:2-4; 렘 39:2-3; 52:5-7", "desc": "BC 586년 7월 18일, 18개월 포위 끝에 성 안의 식량이 다 떨어지고 성벽이 뚫렸다. 바벨론 대신들이 들어와 중문에 앉았다—네르갈사레셀, 삼갈느보, 살스김(이 이름이 새겨진 바벨론 토판이 2007년 확인됨).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF4D4D", "route": "", "lat": 31.718327301669618, "lon": 35. "desc": "느부사라단이 성에 남은 백성과 항복한 사람들을 포로로 끌고 갔다. 포로들은 예루살렘 북쪽 라마에 모였다가 떠났다(렘 40:1). 가장 가난한 사람들만 남겨 포도원과 밭을 맡겼다. 렘 52:29은 이때 예루살렘 사람 832명이라고 기록한다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF4D4D", "route": "예루살렘 → 라마 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.50822062028693, "lon": 44.406273908280525, "flat": 32.5421, "flon": 44.4209, "fname": "이슈타르 문 일대", "fnote": "포로 행렬이 도착한 바벨론 중심부(근사)", "hasfine": true, "sz": true, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 54.0, "lab": "54", "cat": "jer", "date": "BC 586.8월", "title": "예레미야, 궁중 감옥에서 풀려남 · 에벳멜렉 구원", "note": "렘 39:11-14", "desc": "느부갓네살이 예레미야를 잘 돌보라고 명령했고, 바벨론 대신들이 그를 궁중 감옥에서 꺼내 그달랴에게 맡겼다. 에벳멜렉에게 하신 구원의 약속도 이루어졌다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.79478297376879, "lon": 35.17182580408507, "flat": 31.777, "flon": 35.2362, "fname": "시위대 뜰(추정)", "fnote": "느부사라단의 사람들이 예레미야를 감옥 뜰에서 꺼낸 곳(렘 39:14)", "hasfine": true, "sz": true, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 55.0, "lab": "55", "cat": "jer", "date": "BC 586.8월", "title": "라마에서 쇠사슬이 풀림 → 미스바로", "note": "렘 40:1-6", "desc": "예레미야는 다시 포로 행렬에 섞여 쇠사슬에 묶인 채 라마까지 끌려갔다. 느부사라단이 그를 풀어 주며 '네 하나님이 말씀하신 대로 행하셨다'고 말하고, 양식과 선물을 주어 보냈다. 예레미야는 미스바의 그달랴에게 갔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#C78BE8", "route": "라마 → 미스바", "lat": 31.887, "lon": 35.217, "flat": 31.887, "flon": 35.217, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "예레미야 — 예루살렘의 말씀과 사건"}, {"n": 56.0, "lab": "56", "cat": "word", "date": "BC 586 (추정)", "title": "에돔 — 네거리에서 도망하는 자를 막음", "note": "옵 1:10-14; 시 137:7; 애 4:21-22", "desc": "형제 에돔은 '멀리 섰던 날… 너도 그들 중 한 사람 같았느니라'(옵 11). '네거리에 서서 그 도망하는 자를 막지 않을 것이며'(옵 14). 포로들은 바벨론 강변에서 기억했다: '에돔 자손… 헐어 버리라 헐어 버리라 그 기초까지 헐어 버리라 하였나이다'(시 137:7).", "place": "에돔(보스라)", "pnote": "보스라(부세이라 유적) — 에돔 수도", "col": "#E8C547", "route": "", "lat": 30.73, "lon": 35.606, "flat": 30.73, "flon": 35.606, "fname": "에돔(보스라)", "fnote": "보스라(부세이라 유적) — 에돔 수도", "hasfine": false, "sz": false, "folder": "다른 선지자·시편·애가"}, {"n": 57.0, "lab": "57", "cat": "text", "date": "BC 586.8월", "title": "지도자들 처형 — '유다가 본토에서 떠났더라'", "note": "왕하 25:18-21; 렘 52:24-27", "desc": "대제사장 스라야, 부제사장 스바냐, 성전 문지기 세 명, 군 지휘관, 왕의 보좌관(왕하 5명·렘 7명), 징집 서기관, 백성 60명이 립나로 끌려가 처형되었다. '이와 같이 유다가 사로잡혀 본토에서 떠났더라'(왕하 25:21).", "place": "립나", "pnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "col": "#FF4D4D", "route": "예루살렘 → 하솔 → 립나", "lat": 34.42480555816661, "lon": 36.50785127541351, "flat": 34.41703773159028, "flon": 36.51633130314223, "fname": "립나", "fnote": "리블라(Ribleh, 시리아 홈스 남서) 마을 일대 기준 — 통설. 느부갓네살의 본진(왕하 25:6)", "hasfine": false, "sz": false, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 58.0, "lab": "58", "cat": "rem", "date": "BC 586", "title": "그달랴, 유다 총독이 됨", "note": "왕하 25:22; 렘 40:5", "desc": "느부갓네살이 사반의 손자, 아히감의 아들 그달랴를 총독으로 세워 남은 사람들을 다스리게 했다. 그의 집안은 예레미야를 보호했던 가문이었다(렘 26:24).", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "", "lat": 31.895105558166613, "lon": 35.208151275413506, "flat": 31.888, "flon": 35.2175, "fname": "미스바 성문 지대", "fnote": "느부갓네살이 세운 총독 그달랴의 관저", "hasfine": true, "sz": true, "folder": "그달랴와 남은 자들"}, {"n": 59.0, "lab": "59", "cat": "rem", "date": "BC 586 여름~가을", "title": "지휘관들이 모임 — 그달랴의 맹세", "note": "왕하 25:23-24; 렘 40:7-10", "desc": "들에 숨어 있던 지휘관들—이스마엘, 요하난, 스라야, 야아사냐—이 미스바로 왔다. 그달랴는 '바벨론 왕을 섬기면 무사할 것이니 이 땅에 정착해 포도주와 여름 과일과 기름을 거두라'고 맹세했다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "", "lat": 31.87009452599794, "lon": 35.218484906988884, "flat": 31.888, "flon": 35.2175, "fname": "미스바 성문 지대", "fnote": "지휘관들이 그달랴 앞에 모인 곳(렘 40:7-10)", "hasfine": true, "sz": true, "folder": "그달랴와 남은 자들"}, {"n": 60.0, "lab": "60", "cat": "rem", "date": "BC 586 가을", "title": "흩어진 유대인들의 귀환과 풍성한 수확 (모압)", "note": "렘 40:11-12", "desc": "모압·암몬·에돔 등 각지로 흩어졌던 유대인들이 그달랴 소식을 듣고 돌아왔다. 그해 그들은 포도주와 께 있던 유대인과 바벨론 군인들까지 죽였다. 유대인은 지금도 티쉬리월 3일을 '그달랴 금식일'로 지킨다. BC 582년으로 보는 학자들도 있다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "암몬(랍바) → 여리고 → 미스바", "lat": 31.858820620286927, "lon": 35.20237390828052, "flat": 31.8872, "flon": 35.2168, "fname": "그달랴 관저(추정)", "fnote": "식사 중 이스마엘이 그달랴를 칼로 친 곳(렘 41:1-3)", "hasfine": true, "sz": true, "folder": "그달랴와 남은 자들"}, {"n": 63.0, "lab": "63", "cat": "rem", "date": "다음 날", "title": "성전으로 가던 순례자 80명 학살 (세겜)", "note": "렘 41:4-9", "desc": "다음 날, 수염을 깎고 옷을 찢은 채 소제물과 향을 들고 무너진 성전으로 가던 80명이 세겜·실로·사마리아에서 왔다. 이스마엘은 울며 맞으러 나가 그들을 성 안으로 끌어들여 죽이고 아사 왕이 판 구덩이에 던졌다. 숨겨 둔 곡식이 있다고 한 10명만 살려 주었다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "세겜 → 미스바", "lat": 31.898652495084054, "lon": 35.24887819565653, "flat": 31.8868, "flon": 35.216, "fname": "아사 왕의 구덩이(추정)", "fnote": "이스마엘이 시체를 던져 넣은 큰 구덩이 — 아사 왕이 바아사를 막으려 판 것(렘 41:9)", "hasfine": true, "sz": true, "folder": "그달랴와 남은 자들"}, {"n": 63.0, "lab": "63", "cat": "rem", "date": "다음 날", "title": "실로에서 온 순례자들", "note": "렘 41:5", "desc": "실로에서 온 순례자들도 함께였다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "실로 → 미스바", "lat": 31.90072501769958, "lon": 35.18371901610309, "flat": 31.887571875737482, "flon": 35.21561329233763, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "그달랴와 남은 자들"}, {"n": 63.0, "lab": "63", "cat": "rem", "date": "다음 날", "title": "사마리아에서 온 순례자들", "note": "렘 41:5", "desc": "사마리아에서 온 순례자들도 함께였다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "사마리아 → 미스바", "lat": 31.852635717315536, "lon": 35.23309646158577, "flat": 31.885568154888148, "flon": 35.21767068589941, "fname": "미스바", "fnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "hasfine": false, "sz": false, "folder": "그달랴와 남은 자들"}, {"n": 64.0, "lab": "64", "cat": "rem", "date": "직후", "title": "이스마엘, 백성을 사로잡아 암몬으로", "note": "렘 41:10",  여러 강변 거기에 앉아서 시온을 기억하며 울었도다'(137:1). 불탄 성소의 탄식: '주의 성소를 불사르며'(74:7), '그 언약을 눈여겨 보소서'(74:20). 그리고 시 89: '다윗에게 맹세하신 그 전의 인자하심이 어디 있나이까'(89:49) — '하나님, 왜 약속을 안 지키세요?'가 성경 안에 그대로 있다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#E8C547", "route": "", "lat": 32.54805249508406, "lon": 44.452778195656535, "flat": 32.548, "flon": 44.425, "fname": "유프라테스 강변(근사)", "fnote": "바벨론 성을 지나던 유프라테스 강가", "hasfine": true, "sz": true, "folder": "다른 선지자·시편·애가"}, {"n": 74.0, "lab": "74", "cat": "eze", "date": "BC 585 이후", "title": "마른 뼈 골짜기 — '우리의 소망이 없어졌으니'", "note": "겔 36:24-38; 37:1-28", "desc": "포로들의 말: '우리의 뼈들이 말랐고 우리의 소망이 없어졌으니 우리는 다 멸절되었다'(37:11). 하나님은 마른 뼈에 생기를 불어넣으시고, 유다와 에브라임 두 막대기를 하나로 합치셨다(37:17). '새 영을 너희 속에 두고… 굳은 마음을 제거하고 부드러운 마음을'(36:26) — 요시야에게 있던 그 '부드러운 마음'(왕하 22:19).", "place": "그발 강(델아빕)", "pnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "col": "#3DC1C9", "route": "", "lat": 32.14165249508406, "lon": 45.26187819565653, "flat": 32.130485520628504, "flon": 45.23132825815235, "fname": "그발 강(델아빕)", "fnote": "그발 강 = 니푸르 부근 운하 — 델아빕 정확 위치 불명, 니푸르 근처로 표시", "hasfine": false, "sz": false, "folder": "에스겔 — 같은 때 바벨론에서"}, {"n": 75.0, "lab": "75", "cat": "bab", "date": "BC 582/581 (느부갓네살 23년)", "title": "3차 포로 — 745명", "note": "렘 52:30", "desc": "BC 582년, 느부사라단이 유다 사람 745명을 또 잡아갔다. 세 차례 포로 합계 4,600명(렘 52:28-30). 그달랴 암살에 대한 바벨론의 보복으로 보는 견해가 있다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#E8955F", "route": "예루살렘 → 하솔 → 립나 → 하맛 → 갈그미스 → 마리(유프라테스) → 바벨론", "lat": 32.55012501769958, "lon": 44.387619016103095, "flat": 32.5421, "flon": 44.4209, "fname": "이슈타르 문 일대", "fnote": "745명이 도착한 바벨론 중심부(근사)", "hasfine": true, "sz": true, "folder": "바벨론 (침공·포로)"}, {"n": 76.0, "lab": "76", "cat": "eze", "date": "BC 573.4.28 (함락 후 14년)", "title": "새 성전 환상 — 영광이 동문으로 돌아오고, 강이 아라바로", "note": "겔 40:1-4; 43:1-9; 47:1-12; 48:35", "desc": "떠났던 여호와의 영광이 '동쪽에서부터 오는데… 동문을 통하여 성전으로 들어가고… 성전에 가득하더라'(43:2-5). 성전 문지방에서 흘러나온 물이 깊어져 강이 되어 '아라바로 내려가서' 죽은 바다를 살린다(47:8) —   const detail=fineMk.length>0||tails.length>0||its.some(it=>it.type==='p'&&it.d.detail);
  const local=diagM(coarse)<25000;
  if(local&&detail)return {k:'one',t:fitTarget(boundsOf(its.map(it=>ptsOf(it,true))),10,17.5,L.point(120,260))};
  let cb=coarse;if(i>0){const pb=boundsOf(stepItems(seq[i-1]).map(it=>ptsOf(it,false)));if(pb&&pb.getCenter().distanceTo(coarse.getCenter())<120000)cb=L.latLngBounds([coarse.getSouthWest(),coarse.getNorthEast(),pb.getSouthWest(),pb.getNorthEast()])}
  const t1=fitTarget(cb,3.5,local?10:10.5);
  if(fineMk.length||tails.length){const fl=[];fineMk.forEach(it=>fl.push([[it.d.flat,it.d.flon]]));tails.forEach(it=>fl.push(it.d.fpts.slice(Math.max(0,it.d.tailStart))));
    return {k:'two',t1,t2:fitTarget(boundsOf(fl),13,17.5,L.point(120,260)),tails}}
  return {k:'one',t:t1}}
function moveCam(t,dur){if(!t)return false;const cz=map.getZoom();
  if(map.project(map.getCenter(),t.z).distanceTo(map.project(t.c,t.z))<30&&Math.abs(cz-t.z)<0.1)return false;
  if($('cam').value==='auto'&&map.getBounds().pad(-0.08).contains(t.b)&&Math.abs(t.z-cz)<0.75&&t.z<12&&cz<12)return false;
  try{map.flyTo(t.c,t.z,{duration:dur})}catch(e){map.setView(t.c,t.z);return false}return true}
function whenMoved(moved,cb,dur){let done=false;const go=()=>{if(done)return;done=true;cb()};
  if(moved){map.once('moveend',()=>setTimeout(go,150));setTimeout(go,dur*1000+900)}else go()}
// ---------- 자막 ----------
function caption(n){const ms=stepItems(n).filter(it=>it.type==='m').map(it=>it.d);const c=$('cap');
  if(!ms.length){c.classList.remove('show');return}
  const m0=ms[0];c.querySelector('.big').textContent=m0.lab;c.querySelector('.big').style.background=m0.col;
  c.querySelector('.dt').textContent=m0.date+' · '+[...new Set(ms.map(m=>m.place))].join(' / ');
  c.querySelector('.tx').innerHTML=ms.map(m=>`<div class="tt">${m.title}</div><div class="ds">${m.desc}</div>`).join('');
  c.querySelector('.nt').textContent='📖 '+[...new Set(ms.map(m=>m.note))].join(' · ');
  const seen=new Set();c.querySelector('.pl').innerHTML=ms.filter(m=>{const key=m.place+m.route+m.fname;if(seen.has(key))return false;seen.add(key);return true}).map(m=>`📍 <b>${m.place}</b> — ${m.pnote}`+(m.hasfine?`<br>🔎 <b>정밀 위치: ${m.fname}</b> — ${m.fnote}`:'')+(m.route?`<br><span style="color:#888">경로: ${m.route}</span>`:'')).join('<br>');
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}
// ---------- 경로 그리기 ----------
function drawLine(pts,col,ms,tk,cb){const pl=L.polyline([pts[0]],{color:col,weight:5,opacity:1}).addTo(map);anims.push(pl);const t0=performance.now();
  (function step(t){if(tk!==token){map.removeLayer(pl);return}const k=Math.min(1,(t-t0)/ms),upto=Math.max(1,Math.round(k*(pts.length-1)));pl.setLatLngs(pts.slice(0,upto+1));
    if(k<1)requestAnimationFrame(step);else{map.removeLayer(pl);cb()}})(t0)}
function reveal(n,tk,pathMs,cb){if(tk!==token)return;const ps=stepItems(n).filter(it=>it.type==='p');let left=ps.length;
  if(!left){hideP=null;render(false);cb();return}
  ps.forEach(it=>{const pts=(curFine&&it.d.fpts&&!tailSet.has(it))?it.d.fpts:it.d.pts;
    const ms=pathMs*Math.min(1.6,Math.max(0.7,pts.length/21));
    drawLine(pts,it.d.col,ms,tk,()=>{if(--left===0){hideP=null;render(false);cb()}})})}
function tailReveal(n,tk,ms,cb){if(tk!==token)return;const ps=stepItems(n).filter(it=>it.type==='p'&&it.d.fmode==='tail');let left=ps.length;
  if(!left){cb();return}
  ps.forEach(it=>{const pts=it.d.fpts.slice(it.d.tailStart);drawLine(pts,it.d.col,Math.max(500,ms),tk,()=>{tailSet.delete(it);setPath(it,it.d.fpts);if(--left===0)cb()})})}
function numbersInRange(){return [...new Set(items.filter(it=>vis[it.cat]&&it.n>=s0&&it.n<=s1).map(it=>it.n))].sort((a,b)=>a-b)}
function LB(n){const m=items.find(it=>it.type==='m'&&it.n===n);return m?m.d.lab:n}
function showAt(i,manual){const n=seq[i];cur=n;si=i+1;const iv=Math.max(300,+$('iv').value||2500);
  const tk=++token;anims.forEach(a=>map.removeLayer(a));anims=[];tailSet.clear();hideM=n;hideP=n;render(false);
  caption(n);items.forEach(it=>{if(it.type==='m')it.el.classList.toggle('act',it.n===n)});
  const a=items.find(it=>it.type==='m'&&it.n===n&&vis[it.cat]);if(a)a.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstChild.style.width=((i+1)/seq.length*100)+'%';
  $('st').textContent=`${manual?'수동':'재생 중'} — ${LB(n)} (${i+1}/${seq.length})`;
  map.invalidateSize();const plan=camPlan(n,i);planTwo=plan.k==='two';
  const camDur=Math.min(1.5,Math.max(0.4,iv/1000*0.3)),pathMs=Math.min(1700,Math.max(250,iv*0.35));
  const finish=()=>{if(tk!==token)return;hideM=null;render(false)};
  const phaseB=()=>{if(tk!==token)return;plan.tails.forEach(it=>tailSet.add(it));
    const mv=moveCam(plan.t2,camDur*1.3);
    whenMoved(mv,()=>{if(tk!==token)return;applyFine(true,true,true);tailReveal(n,tk,pathMs*0.8,finish)},camDur*1.3)};
  const afterPaths=()=>{if(tk!==token)return;if(plan.k==='two')phaseB();else finish()};
  const mv=moveCam(plan.k==='two'?plan.t1:plan.t,camDur);
  whenMoved(mv,()=>reveal(n,tk,pathMs,afterPaths),camDur)}
function tick(){if(paused)return;if(si>=seq.length){$('st').textContent=`완료 — ${LB(seq[0])}~${LB(seq[seq.length-1])}`;timer=null;return}
  const iv=Math.max(300,+$('iv').value||2500);showAt(si,false);timer=setTimeout(tick,iv+(planTwo?Math.min(2500,iv*0.6):0))}
function initSeq(){s0=Math.max(KMIN,Math.min(KMAX,+$('s0').value||KMIN));s1=Math.max(KMIN,Math.min(KMAX,+$('s1').value||KMAX));if(s0>s1)[s0,s1]=[s1,s0];mode='play';seq=numbersInRange();si=0;cur=s0-1}
function manualStep(dir){clearTimeout(timer);timer=null;
  if(mode!=='play'){initSeq();paused=true;if(!seq.length)return;showAt(dir>0?0:seq.length-1,true);return}
  paused=true;const t=si-1+dir;if(t<0||t>=seq.length){$('st').textContent=`${t<0?'처음':'마지막'} 단계입니다 — ${LB(cur)}`;return}showAt(t,true)}
function startFrom(n){clearTimeout(timer);timer=null;$('s0').value=n;if((+$('s1').value||KMAX)<n)$('s1').value=KMAX;
  initSeq();paused=true;if(!seq.length)return;showAt(0,true);$('st').textContent=`${LB(n)}번부터 시작 — Next ▶ 로 이어가기 (1/${seq.length})`}
$('bNext').onclick=()=>manualStep(1);$('bPrev').onclick=()=>manualStep(-1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight'){manualStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){manualStep(-1);e.preventDefault()}
  else if(e.key===' '){(mode==='play'&&!paused)?$('bPause').click():$('bPlay').click();e.preventDefault()}});
$('bPlay').onclick=()=>{if(mode==='play'&&paused){paused=false;$('st').textContent='재생 재개';tick();return}if(mode==='play'&&timer)return;initSeq();paused=false;render(false);tick()};
$('bPause').onclick=()=>{if(mode!=='play')return;paused=true;clearTimeout(timer);timer=null;$('st').textContent=`일시정지 — ${LB(cur)}`};
$('bStop').onclick=()=>{clearTimeout(timer);timer=null;paused=false;mode='all';token++;hideM=hideP=null;tailSet.clear();anims.forEach(a=>map.removeLayer(a));anims=[];
  $('cap').classList.remove('show');$('prog').firstChild.style.width='0';items.forEach(it=>it.el&&it.el.classList.remove('act'));
  render(true);$('st').textContent='정지 — 전체 보기'};
render(false);map.fitBounds([[29.5, 30.5], [37.2, 46]]);updZl();
</script></body></html>
