<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>예수님 족보 지도 연표</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#141414;font-family:'Malgun Gothic',sans-serif}
#map{position:absolute;inset:0 0 0 320px}
#side{position:absolute;left:0;top:0;bottom:0;width:320px;display:flex;flex-direction:column;background:#1b1b1b;color:#ddd;font-size:12px}
#side h1{font-size:14px;margin:10px 10px 6px;color:#fff}
#lg{padding:0 8px 6px;display:flex;flex-wrap:wrap;gap:4px}
#lg .c{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid #333;border-radius:12px;cursor:pointer;user-select:none;background:#222}
#lg .c i{width:10px;height:10px;border-radius:50%;display:inline-block}
#lg .c.off{opacity:.35;text-decoration:line-through}
#ctl{padding:8px 10px;border-top:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;background:#202020}
#ctl label{display:inline-block;margin-right:6px;color:#aaa}
#ctl input{width:52px;background:#111;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 4px}
#ctl input#iv{width:62px}
#ctl .btns{margin-top:6px;display:flex;gap:6px}
#ctl button{flex:1;padding:5px 0;border:0;border-radius:5px;font-weight:700;cursor:pointer;color:#111}
#bPlay{background:#5CC98A}#bPause{background:#F2C14E}#bStop{background:#FF6B6B}#bPrev,#bNext{background:#9CC7F0}
#st{margin-top:5px;color:#aaa;font-size:11px}
#list{flex:1;overflow:auto}
#list .it{padding:4px 10px;border-bottom:1px solid #2a2a2a;cursor:pointer}
#list .it:hover{background:#2a2a2a}
#list .it.act{background:#3a2f12;color:#fff}
#list .it.hid{display:none}
.num{display:flex;align-items:center;justify-content:center;border-radius:11px;color:#111;font-weight:700;font-size:11px;border:1px solid #111;min-width:22px;height:22px;padding:0 3px;box-sizing:border-box;white-space:nowrap}
.num.cur{animation:pulse 1s ease-out infinite;transform-origin:center;box-shadow:0 0 0 0 rgba(255,255,255,.8)}
@keyframes pulse{0%{transform:scale(1.9);box-shadow:0 0 0 0 rgba(255,255,255,.9)}70%{transform:scale(1.5);box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{transform:scale(1.5)}}
#cap{position:absolute;left:calc(320px + 50% - 160px);transform:translateX(-50%);bottom:28px;z-index:1000;min-width:420px;max-width:720px;
 background:rgba(15,15,15,.88);color:#fff;border-radius:14px;padding:14px 18px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#cap.show{display:flex;gap:14px;align-items:center;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
#cap .big{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#111}
#cap .dt{color:#bbb;font-size:12px}#cap .tt{font-size:17px;font-weight:700;margin:4px 0 2px}#cap .ds{font-size:13.5px;line-height:1.55;color:#eee}#cap .nt{color:#999;font-size:11.5px;margin-top:6px}#cap .body{max-height:42vh;overflow:auto}#cap .pl{color:#9fd3ff;font-size:11.5px;margin-top:6px;line-height:1.5;border-top:1px solid #333;padding-top:6px}
#prog{position:absolute;left:320px;right:0;top:0;height:4px;z-index:1000;background:transparent}
#prog div{height:100%;width:0;background:#F2C14E;transition:width .3s}
@media (max-width:820px){#side{right:0;bottom:auto;width:auto;height:42%}#map{inset:42% 0 0 0}#prog{left:0;top:42%}#cap{left:50%;bottom:12px;min-width:0;width:calc(100% - 24px);padding:10px 12px}#cap .big{width:44px;height:44px;font-size:18px}#cap .tt{font-size:14px}#cap .ds{font-size:12.5px}}
</style></head><body>
<div id="side">
 <h1>예수님 족보 지도 연표 (1–74)</h1>
 <div id="lg"></div>
 <div id="ctl">
  <label>시작 <input id="s0" type="number" min="1" max="74" value="1"></label>
  <label>끝 <input id="s1" type="number" min="1" max="74" value="74"></label>
  <label>간격 <input id="iv" type="number" min="300" step="100" value="2500">ms</label>
  <div class="btns"><button id="bPlay">▶ Play</button><button id="bPause">❚❚ Pause</button><button id="bStop">■ Stop</button></div><div class="btns"><button id="bPrev">◀ Prev</button><button id="bNext">Next ▶</button></div>
  <div id="st">정지 — 전체 보기</div>
 </div>
 <div id="list"></div>
</div>
<div id="map"></div><div id="prog"><div></div></div>
<div id="cap"><div class="big"></div><div class="body"><div class="dt"></div><div class="tx"></div><div class="nt"></div><div class="pl"></div></div></div>
<script>
const D={"markers": [{"n": 1, "per": 1, "kind": "g", "date": "BC 2166", "title": "아브라함 출생 — 갈대아 우르", "note": "창 11:27-28", "place": "우르", "lat": 30.9626, "lon": 46.1031, "col": "#F2C14E", "desc": "BC 2166년, 데라의 아들 아브람(훗날 아브라함)이 갈대아 우르에서 태어났다. 우르는 달신 '난나'를 섬기던 수메르의 큰 도시였다(수 24:2).", "lab": "1", "pnote": "텔 엘-무카이야르 유적(이라크 남부) 기준 — 울리 발굴. 튀르키예 우르파설도 있음", "route": "", "cat": "p1"}, {"n": 2, "per": 1, "kind": "g", "date": "BC 2100경", "title": "데라와 함께 하란으로", "note": "창 11:31", "place": "하란", "lat": 36.865, "lon": 39.031, "col": "#F2C14E", "desc": "BC 2100년경, 아버지 데라가 아브람과 아내 사래, 조카 롯을 데리고 가나안으로 가려고 우르를 떠났으나 하란에 머물러 살다가 그곳에서 죽었다.", "lab": "2", "pnote": "하란 유적(튀르키예 샨르우르파주) 기준 — 통설", "route": "우르 → 하란", "cat": "p1"}, {"n": 3, "per": 1, "kind": "g", "date": "BC 2091", "title": "부르심 — 가나안으로", "note": "창 12:1-6 · 75세", "place": "세겜", "lat": 32.2137, "lon": 35.282, "col": "#F2C14E", "desc": "BC 2091년, 75세의 아브람이 '너의 고향과 친척과 아버지의 집을 떠나 내가 보여 줄 땅으로 가라'는 부르심을 받고 가나안 세겜의 모레 상수리나무에 이르러 제단을 쌓았다.", "lab": "3", "pnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "route": "하란 → 세겜", "cat": "p1"}, {"n": 4, "per": 1, "kind": "g", "date": "BC 2090경", "title": "기근으로 애굽에 내려감", "note": "창 12:10", "place": "애굽(멤피스)", "lat": 29.8446, "lon": 31.2502, "col": "#F2C14E", "desc": "BC 2090년경, 가나안에 기근이 들자 아브람이 애굽으로 내려갔고, 아내 사래를 누이라 속였다가 바로의 집에 재앙이 내렸다.", "lab": "4", "pnote": "고대 수도 멤피스(현 미트 라히나) — '애굽'을 대표하는 지점으로 선택", "route": "세겜 → 벧엘 → 애굽(멤피스)", "cat": "p1"}, {"n": 5, "per": 1, "kind": "g", "date": "BC 2089경", "title": "애굽에서 올라와 헤브론 마므레에 거주", "note": "창 13", "place": "헤브론", "lat": 31.5326, "lon": 35.0998, "col": "#F2C14E", "desc": "BC 2089년경, 아브람이 애굽에서 나와 벧엘로 돌아와 롯과 갈라선 뒤 헤브론 마므레 상수리 숲에 장막을 치고 제단을 쌓았다.", "lab": "5", "pnote": "현 헤브론 시(마므레 전승지 인근) 기준", "route": "애굽(멤피스) → 헤브론", "cat": "p1"}, {"n": 6, "per": 1, "kind": "g", "date": "BC 2085경", "title": "롯을 구하러 단까지 추격", "note": "창 14:14", "place": "단", "lat": 33.2486, "lon": 35.6525, "col": "#F2C14E", "desc": "BC 2085년경, 그돌라오멜 연합군이 소돔을 쳐서 롯을 사로잡아 가자, 아브람이 집에서 길린 318명을 이끌고 단까지 쫓아가 롯과 재물을 되찾았다.", "lab": "6", "pnote": "텔 단 유적 기준 — 1993년 '다윗의 집' 비문 출토지", "route": "헤브론 → 단", "cat": "p1"}, {"n": 6, "per": 1, "kind": "m", "date": "BC 2085경", "title": "멜기세덱 — 살렘 왕, 지극히 높은 하나님의 제사장", "note": "창 14:18-20; 히 7", "place": "예루살렘", "lat": 31.7781, "lon": 35.2354, "col": "#C78BE8", "desc": "BC 2085년경, 전쟁에서 돌아오는 아브람을 살렘 왕이자 지극히 높으신 하나님의 제사장 멜기세덱이 떡과 포도주로 맞아 축복했고, 아브람은 얻은 것의 십분의 일을 드렸다. 히브리서는 그를 그리스도의 모형으로 본다(히 7).", "lab": "6", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "단 → 예루살렘", "cat": "m"}, {"n": 7, "per": 1, "kind": "g", "date": "BC 2085경", "title": "횃불 언약", "note": "창 15 · 400년 종살이 예고", "place": "헤브론", "lat": 31.5629958431248, "lon": 35.06661728280064, "col": "#F2C14E", "desc": "BC 2085년경, 하나님이 아브람에게 하늘의 별처럼 많은 자손과 땅을 약속하시고, 쪼갠 짐승 사이로 연기 나는 화로와 타는 횃불로 홀로 지나가셨다. 이때 후손이 400년 동안 이방에서 종살이할 것도 예고하셨다.", "lab": "7", "pnote": "현 헤브론 시(마므레 전승지 인근) 기준", "route": "", "cat": "p1"}, {"n": 8, "per": 1, "kind": "m", "date": "BC 2080", "title": "여호와의 사자 — 도망친 하갈을 만남", "note": "창 16:7 · 술 길 샘물", "place": "술 길 샘", "lat": 30.85, "lon": 34.35, "col": "#C78BE8", "desc": "BC 2080년, 임신한 하갈이 사래의 학대를 피해 도망하다 술 길 샘물 곁에서 여호와의 사자를 만났다. 하갈은 '나를 살피시는 하나님(엘 로이)'이라 고백하고 돌아가 이스마엘을 낳았다.", "lab": "8", "pnote": "정확한 위치 불명 — 가나안 남부에서 애굽으로 가는 '술 길' 위 임의 지점", "route": "헤브론 → 술 길 샘", "cat": "m"}, {"n": 9, "per": 1, "kind": "g", "date": "BC 2066", "title": "이삭 출생", "note": "창 21 · 브엘세바 부근", "place": "브엘세바", "lat": 31.245, "lon": 34.84, "col": "#F2C14E", "desc": "BC 2066년, 약속하신 지 25년 만에 100세 아브라함과 90세 사라 사이에서 약속의 아들 이삭('웃음')이 태어났다.", "lab": "9", "pnote": "텔 베에르 셰바 유적 기준 — 통설", "route": "", "cat": "p1"}, {"n": 10, "per": 1, "kind": "m", "date": "BC 2050경", "title": "모리아산 — 이삭을 바침, 여호와의 사자", "note": "창 22 · 모리아 = 훗날 성전 터(대하 3:1)", "place": "예루살렘", "lat": 31.8084958431248, "lon": 35.20221728280064, "col": "#C78BE8", "desc": "BC 2050년경, 하나님이 아브라함에게 이삭을 모리아 땅 한 산에서 번제로 드리라 하셨고, 칼을 든 순간 여호와의 사자가 막아 숫양을 대신 준비하셨다(여호와 이레). 모리아는 훗날 솔로몬 성전 터가 된다(대하 3:1).", "lab": "10", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "브엘세바 → 예루살렘", "cat": "m"}, {"n": 11, "per": 1, "kind": "g", "date": "BC 1929경", "title": "야곱, 에서를 피해 하란으로 (벧엘의 꿈)", "note": "창 28", "place": "하란", "lat": 36.8953958431248, "lon": 38.99781728280064, "col": "#F2C14E", "desc": "BC 1929년경, 장자의 축복을 가로챈 야곱이 형 에서를 피해 외삼촌 라반이 있는 하란으로 도망했고, 가는 길에 벧엘에서 하늘에 닿은 사다리 꿈을 꾸었다.", "lab": "11", "pnote": "하란 유적(튀르키예 샨르우르파주) 기준 — 통설", "route": "브엘세바 → 벧엘 → 하란", "cat": "p1"}, {"n": 12, "per": 1, "kind": "g", "date": "BC 1909경", "title": "야곱 귀향 — 브니엘에서 '이스라엘'", "note": "창 32-33", "place": "세겜", "lat": 32.2440958431248, "lon": 35.24881728280064, "col": "#F2C14E", "desc": "BC 1909년경, 하란에서 20년을 지낸 야곱이 가족과 함께 돌아오다 얍복 강 브니엘에서 밤새 씨름한 끝에 '이스라엘'이라는 새 이름을 받고, 형 에서와 화해했다.", "lab": "12", "pnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "route": "하란 → 브니엘(얍복) → 세겜", "cat": "p1"}, {"n": 13, "per": 1, "kind": "g", "date": "BC 1900경", "title": "유다와 다말 — 베레스·세라 출생", "note": "창 38 · 족보 첫 여인", "place": "아둘람", "lat": 31.65, "lon": 34.99, "col": "#F2C14E", "desc": "BC 1900년경, 야곱의 넷째 아들 유다가 아둘람에 머물 때 며느리 다말에게서 쌍둥이 베레스와 세라를 얻었다. 다말은 마태복음 족보에 이름이 오른 첫 여인이다.", "lab": "13", "pnote": "텔 아둘람 기준 — 통설", "route": "", "cat": "p1"}, {"n": 14, "per": 1, "kind": "g", "date": "BC 1876", "title": "야곱 가족 70명 애굽 이주 (베레스·헤스론 포함)", "note": "창 46:12", "place": "고센(라암셋)", "lat": 30.799, "lon": 31.834, "col": "#F2C14E", "desc": "BC 1876년, 총리가 된 요셉의 초청으로 130세 야곱과 가족 70명이 브엘세바에서 제사를 드린 뒤 애굽 고센 땅으로 이주했다. 명단에 유다의 손자 헤스론도 들어 있다(창 46:12).", "lab": "14", "pnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "route": "헤브론 → 브엘세바 → 고센(라암셋)", "cat": "p1"}, {"n": 15, "per": 1, "kind": "g", "date": "BC 1876–1446", "title": "400년 종살이 — 람·아미나답 세대", "note": "출 1 · 창 15:13 성취", "place": "고센(라암셋)", "lat": 30.8293958431248, "lon": 31.800817282800644, "col": "#F2C14E", "desc": "BC 1876~1446년, 요셉을 모르는 새 왕이 일어나 이스라엘 자손을 노예로 삼아 국고성 비돔과 라암셋을 짓게 했다. 람과 아미나답이 이 종살이 시대를 살았고, 창 15:13의 400년 예언이 이루어지고 있었다.", "lab": "15", "pnote": "라암셋(피-라암세스, 콴티르 유적, 나일 삼각주 동부) 기준 — 고센 땅 대표 지점", "route": "", "cat": "p1"}, {"n": 16, "per": 1, "kind": "m", "date": "BC 1447", "title": "떨기나무 — 여호와의 사자, 모세를 부르심", "note": "출 3", "place": "시내산(호렙)", "lat": 28.5392, "lon": 33.975, "col": "#C78BE8", "desc": "BC 1447년, 미디안 광야에서 양을 치던 80세 모세에게 호렙산 떨기나무 불꽃 가운데 여호와의 사자가 나타나 '나는 스스로 있는 자'라 이름을 알리시고 애굽으로 보내셨다.", "lab": "16", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "route": "", "cat": "m"}, {"n": 17, "per": 1, "kind": "g", "date": "BC 1446", "title": "출애굽 — 나손 세대", "note": "출 12-14 · 홍해 도하 위치는 논쟁 중", "place": "시내산(호렙)", "lat": 28.5695958431248, "lon": 33.94181728280064, "col": "#F2C14E", "desc": "BC 1446년, 열 가지 재앙과 유월절 후 이스라엘 백성이 라암셋을 떠나 숙곳을 거쳐 홍해를 건너 시내산으로 향했다. 유다 지파 족장 나손이 이 세대이다.", "lab": "17", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "route": "고센(라암셋) → 숙곳 → 홍해 → 시내산(호렙)", "cat": "p1"}, {"n": 18, "per": 1, "kind": "m", "date": "BC 1446", "title": "시내산 언약 · 십계명 — 선지자 모세", "note": "출 19-20", "place": "시내산(호렙)", "lat": 28.47580447249227, "lon": 33.98056840120833, "col": "#C78BE8", "desc": "BC 1446년, 출애굽 3개월째 시내산에서 하나님이 모세를 통해 십계명을 주시고 이스라엘과 언약을 맺으셨다. 선지자들은 이 언약을 '신혼 때의 사랑', 곧 결혼으로 회고한다(렘 2:2).", "lab": "18", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "route": "", "cat": "m"}, {"n": 19, "per": 1, "kind": "g", "date": "BC 1445–1406", "title": "광야 40년", "note": "민수기", "place": "느보산", "lat": 31.768, "lon": 35.726, "col": "#F2C14E", "desc": "BC 1445~1406년, 가데스 바네아에서 정탐꾼의 부정적 보고를 믿고 원망한 출애굽 1세대가 광야에서 40년을 방황하다 죽고, 모세는 느보산에서 약속의 땅을 바라본 뒤 숨을 거두었다.", "lab": "19", "pnote": "요르단 느보산(라스 시야가) 전통 위치", "route": "시내산(호렙) → 가데스 바네아 → 느보산", "cat": "p1"}, {"n": 20, "per": 1, "kind": "g", "date": "BC 1406", "title": "가나안 입성 — 여리고, 살몬과 라합", "note": "수 2, 6", "place": "여리고", "lat": 31.8711, "lon": 35.444, "col": "#F2C14E", "desc": "BC 1406년, 여호수아가 이끄는 이스라엘이 요단강을 건너 여리고를 무너뜨렸다. 정탐꾼을 숨겨 준 기생 라합이 구원받아 유다 지파 살몬과 결혼하고 보아스를 낳는다(마 1:5).", "lab": "20", "pnote": "텔 에스-술탄 유적 기준", "route": "느보산 → 여리고", "cat": "p1"}, {"n": 21, "per": 1, "kind": "m", "date": "BC 1373–1334", "title": "사사 옷니엘", "note": "삿 1:13; 3:9", "place": "드빌", "lat": 31.499, "lon": 34.967, "col": "#C78BE8", "desc": "BC 1373~1334년, 갈렙의 조카 옷니엘이 메소보다미아 왕 구산 리사다임에게서 이스라엘을 구원한 첫 사사가 되어 40년간 평화를 이끌었다.", "lab": "21", "pnote": "키르벳 라부드(헤브론 남서) 기준 — 통설", "route": "", "cat": "m"}, {"n": 22, "per": 1, "kind": "m", "date": "BC 1316–1236", "title": "사사 에훗 — 모압 왕 에글론", "note": "삿 3", "place": "여리고", "lat": 31.9014958431248, "lon": 35.41081728280064, "col": "#C78BE8", "desc": "BC 1316~1236년, 왼손잡이 에훗이 모압 왕 에글론을 찔러 죽이고 이스라엘을 구원해 80년간 평화가 이어졌다. 모압이 차지했던 '종려나무 성읍' 여리고 일대가 무대이다.", "lab": "22", "pnote": "텔 에스-술탄 유적 기준", "route": "", "cat": "m"}, {"n": 23, "per": 1, "kind": "m", "date": "BC 1216–1176", "title": "사사 드보라·바락 — 다볼산", "note": "삿 4-5", "place": "다볼산", "lat": 32.687, "lon": 35.39, "col": "#C78BE8", "desc": "BC 1216~1176년, 여선지자이자 사사 드보라가 바락과 함께 다볼산에서 가나안 왕 야빈의 군대장관 시스라의 철병거 900대를 물리쳤다.", "lab": "23", "pnote": "다볼산 정상 기준 — 확실", "route": "", "cat": "m"}, {"n": 24, "per": 1, "kind": "m", "date": "BC 1169", "title": "사사 기드온 — 여호와의 사자가 부름", "note": "삿 6", "place": "오브라", "lat": 32.607, "lon": 35.289, "col": "#C78BE8", "desc": "BC 1169년, 미디안의 압제로 포도주 틀에 숨어 밀을 타작하던 기드온을 여호와의 사자가 '큰 용사여'라 부르셨고, 기드온은 300명으로 미디안을 이겼다.", "lab": "24", "pnote": "기드온의 오브라 — 위치 불명, 이스르엘 골짜기 부근으로 표시", "route": "", "cat": "m"}, {"n": 25, "per": 1, "kind": "g", "date": "BC 1140경", "title": "룻이 나오미와 베들레헴으로 — 보아스·오벳", "note": "룻 1-4 · 모압 여인", "place": "베들레헴", "lat": 31.7054, "lon": 35.2024, "col": "#F2C14E", "desc": "BC 1140년경, 사사 시대 흉년에 모압으로 갔다가 남편과 두 아들을 잃은 나오미가 며느리 룻과 베들레헴으로 돌아왔고, 룻은 기업 무를 자 보아스와 결혼해 다윗의 할아버지 오벳을 낳았다.", "lab": "25", "pnote": "현 베들레헴(예수 탄생 교회) 기준", "route": "모압 → 베들레헴", "cat": "p1"}, {"n": 26, "per": 1, "kind": "m", "date": "BC 1107–1067", "title": "제사장·사사 엘리 — 실로 성막", "note": "삼상 1-4", "place": "실로", "lat": 32.0556, "lon": 35.2897, "col": "#C78BE8", "desc": "BC 1107~1067년, 제사장 엘리가 실로 성막에서 40년간 이스라엘을 다스렸으나, 아들 홉니와 비느하스의 죄로 언약궤를 블레셋에 빼앗기고 '이가봇(영광이 떠났다)'의 날을 맞았다.", "lab": "26", "pnote": "텔 실로 유적 기준 — 확실", "route": "", "cat": "m"}, {"n": 27, "per": 1, "kind": "m", "date": "BC 1095", "title": "여호와의 사자 — 삼손의 부모", "note": "삿 13", "place": "소라", "lat": 31.776, "lon": 34.982, "col": "#C78BE8", "desc": "BC 1095년경, 소라의 마노아 아내에게 여호와의 사자가 나타나 블레셋에게서 이스라엘을 구원하기 시작할 나실인 아들 삼손의 출생을 알렸다.", "lab": "27", "pnote": "텔 초라 기준 — 통설", "route": "", "cat": "m"}, {"n": 28, "per": 1, "kind": "m", "date": "BC 1086–1080", "title": "사사 입다", "note": "삿 11", "place": "길르앗 미스바", "lat": 32.33, "lon": 35.8, "col": "#C78BE8", "desc": "BC 1086~1080년, 기생의 아들로 쫓겨났던 길르앗 사람 입다가 사사로 세워져 암몬을 물리쳤으나, 경솔한 서원으로 외동딸을 잃는 비극을 겪었다.", "lab": "28", "pnote": "위치 불명 — 요단강 동편 길르앗 지역 대표 지점", "route": "", "cat": "m"}, {"n": 29, "per": 1, "kind": "m", "date": "BC 1075–1055", "title": "사사 삼손", "note": "삿 14-16", "place": "소라", "lat": 31.8063958431248, "lon": 34.94881728280064, "col": "#C78BE8", "desc": "BC 1075~1055년, 나실인 삼손이 20년간 사사로 블레셋과 싸웠고, 들릴라에게 비밀을 누설해 힘을 잃었다가 마지막에 다곤 신전을 무너뜨리며 죽었다.", "lab": "29", "pnote": "텔 초라 기준 — 통설", "route": "", "cat": "m"}, {"n": 30, "per": 1, "kind": "m", "date": "BC 1025경", "title": "사무엘(마지막 사사·선지자)이 이새의 아들 다윗에게 기름부음", "note": "삼상 16", "place": "베들레헴", "lat": 31.7357958431248, "lon": 35.16921728280064, "col": "#C78BE8", "desc": "BC 1025년경, 마지막 사사이자 선지자 사무엘이 라마에서 베들레헴으로 가서, 사울 대신 이새의 막내아들 소년 다윗에게 기름을 부었다. '사람은 외모를 보거니와 여호와는 중심을 보느니라'(삼상 16:7).", "lab": "30", "pnote": "현 베들레헴(예수 탄생 교회) 기준", "route": "라마 → 베들레헴", "cat": "m"}, {"n": 31, "per": 1, "kind": "k", "date": "BC 1010 → 1003", "title": "다윗 — 헤브론에서 즉위, 예루살렘으로 / 나단의 다윗 언약", "note": "삼하 2, 5, 7", "place": "예루살렘", "lat": 31.71470447249227, "lon": 35.24096840120833, "col": "#F2C14E", "desc": "BC 1010년, 다윗이 헤브론에서 유다의 왕이 되고 7년 반 뒤 예루살렘을 정복해 수도로 삼았다. 선지자 나단을 통해 '네 왕위가 영원히 견고하리라'는 다윗 언약을 받았다.", "lab": "31", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "헤브론 → 예루살렘", "cat": "p1"}, {"n": 32, "per": 2, "kind": "k", "date": "BC 959", "title": "솔로몬 성전 완공 — 하늘에서 불", "note": "왕상 8; 대하 7:1", "place": "예루살렘", "lat": 31.839960287903462, "lon": 35.282816292352955, "col": "#4FA3E0", "desc": "BC 959년, 다윗의 아들 솔로몬이 7년 공사 끝에 모리아산에 성전을 완공했다. 봉헌 기도를 마치자 하늘에서 불이 내려 제물을 태우고 여호와의 영광이 성전에 가득했다(대하 7:1).", "lab": "32", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "p2"}, {"n": 33, "per": 2, "kind": "k", "date": "BC 931", "title": "왕국 분열 — 르호보암이 세겜에 갔다가 거절당함", "note": "왕상 12:1-19", "place": "세겜", "lat": 32.15030447249227, "lon": 35.287568401208325, "col": "#4FA3E0", "desc": "BC 931년, 솔로몬이 죽은 뒤 아들 르호보암이 세겜에서 왕으로 세워지려 했으나, 멍에를 가볍게 해 달라는 백성의 요구를 '전갈 채찍'으로 거절해 북쪽 10지파가 떨어져 나갔다.", "lab": "33", "pnote": "텔 발라타 유적(현 나블루스 동쪽) 기준 — 통설", "route": "예루살렘 → 세겜", "cat": "p2"}, {"n": 33, "per": 2, "kind": "k", "date": "BC 931", "title": "여로보암 — 벧엘의 금송아지 (남쪽 끝)", "note": "왕상 12:28-29", "place": "벧엘", "lat": 31.93, "lon": 35.2217, "col": "#4FA3E0", "desc": "BC 931년, 북이스라엘의 첫 왕 여로보암이 백성이 예루살렘 성전으로 가면 마음이 돌아설까 두려워 남쪽 끝 벧엘에 금송아지를 세우고 '이스라엘아 너희를 애굽에서 인도한 신이라' 했다.", "lab": "33", "pnote": "베이틴 마을 기준 — 통설(엘-비레설도 있음)", "route": "세겜 → 벧엘", "cat": "p2"}, {"n": 33, "per": 2, "kind": "k", "date": "BC 931", "title": "여로보암 — 단의 금송아지 (북쪽 끝)", "note": "왕상 12:29-30", "place": "단", "lat": 33.278995843124804, "lon": 35.619317282800644, "col": "#4FA3E0", "desc": "BC 931년, 여로보암이 북쪽 끝 단에도 금송아지를 세우고 레위인이 아닌 제사장과 임의의 절기를 만들었다. 이후 북이스라엘 왕들은 모두 '여로보암의 죄'에서 떠나지 않았다.", "lab": "33", "pnote": "텔 단 유적 기준 — 1993년 '다윗의 집' 비문 출토지", "route": "세겜 → 단", "cat": "p2"}, {"n": 34, "per": 2, "kind": "k", "date": "BC 913–848", "title": "남유다 아비야·아사·여호사밧", "note": "왕상 15, 22", "place": "예루살렘", "lat": 31.76241058968993, "lon": 35.14677809297853, "col": "#4FA3E0", "desc": "BC 913~848년, 남유다에서 아비야에 이어 아사가 우상을 제거하는 개혁을 했고, 여호사밧은 백성에게 율법을 가르쳤으나 북이스라엘 아합 집안과 혼인 동맹을 맺었다.", "lab": "34", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "p2"}, {"n": 35, "per": 2, "kind": "m", "date": "BC 860경", "title": "엘리야 — 갈멜산 대결", "note": "왕상 18", "place": "갈멜산", "lat": 32.67, "lon": 35.05, "col": "#C78BE8", "desc": "BC 860년경, 선지자 엘리야가 3년 반의 가뭄 끝에 갈멜산에서 바알 선지자 450명과 대결해, 하늘에서 내린 불로 여호와가 참 하나님이심을 증명했다.", "lab": "35", "pnote": "무흐라카(엘리야 제단 전승지) 기준", "route": "", "cat": "m"}, {"n": 36, "per": 2, "kind": "m", "date": "BC 860경", "title": "엘리야 도피 — 로뎀나무 아래 천사, 호렙산", "note": "왕상 19", "place": "시내산(호렙)", "lat": 28.601060287903465, "lon": 34.02241629235296, "col": "#C78BE8", "desc": "BC 860년경, 이세벨의 살해 위협을 피해 도망한 엘리야가 브엘세바 광야 로뎀나무 아래서 죽기를 구했으나 천사가 떡과 물로 먹였고, 40일을 걸어 호렙산에서 세미한 소리로 하나님을 만났다.", "lab": "36", "pnote": "전통적 위치 제벨 무사(성 캐서린 수도원) 기준 — 사우디 제벨 알-라우즈 등 다른 설 다수", "route": "갈멜산 → 브엘세바 → 시내산(호렙)", "cat": "m"}, {"n": 37, "per": 2, "kind": "k", "date": "BC 853–841", "title": "요람 — 아합의 딸 아달랴와 결혼", "note": "왕하 8:16-18", "place": "예루살렘", "lat": 31.724108391620952, "lon": 35.320311166666364, "col": "#4FA3E0", "desc": "BC 853~841년, 남유다 왕 요람이 아합과 이세벨의 딸 아달랴와 결혼해 바알 숭배가 남유다에까지 들어왔다. 훗날 아달랴는 다윗 왕족을 죽이고 왕위를 빼앗는다.", "lab": "37", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "p2"}, {"n": 37, "per": 2, "kind": "m", "date": "BC 848–797", "title": "엘리사 — 사마리아·도단", "note": "왕하 2-13", "place": "도단", "lat": 32.413, "lon": 35.238, "col": "#C78BE8", "desc": "BC 848~797년, 엘리야의 뒤를 이은 엘리사가 사마리아를 중심으로 활동했고, 도단에서 아람 군대에 포위되었을 때 사환의 눈을 열어 산에 가득한 불말과 불병거를 보게 했다(왕하 6).", "lab": "37", "pnote": "텔 도탄 유적 기준 — 통설", "route": "사마리아 → 도단", "cat": "m"}, {"n": 38, "per": 2, "kind": "m", "date": "BC 785경", "title": "요나 — 다시스로 도망, 폭풍과 큰 물고기", "note": "욘 1:1-17", "place": "지중해(요나의 폭풍)", "lat": 33.2, "lon": 32.6, "col": "#C78BE8", "desc": "BC 785년경, 여로보암 2세 시대의 선지자 요나가 '니느웨로 가라'는 명령을 피해 욥바에서 다시스(스페인 남부 타르테소스로 추정)행 배를 탔으나, 큰 폭풍 속에 바다에 던져져 큰 물고기 뱃속에서 사흘 밤낮을 보냈다.", "lab": "38-1", "pnote": "위치 불명 — 욥바에서 다시스(스페인 남부 타르테소스 추정) 방향 바다 위 임의 지점", "route": "욥바 → 지중해(요나의 폭풍)", "cat": "m"}, {"n": 38.5, "per": 2, "kind": "m", "date": "BC 785경", "title": "요나 — 물고기 배에서 나와 니느웨로", "note": "욘 2:10–3:10", "place": "니느웨", "lat": 36.359, "lon": 43.152, "col": "#C78BE8", "desc": "BC 785년경, 물고기 뱃속에서 기도한 요나를 물고기가 육지에 토해 냈고, 요나는 앗수르의 수도 니느웨로 가서 '사십 일이 지나면 니느웨가 무너지리라'고 외쳤다. 왕부터 백성까지 회개하자 하나님이 재앙을 거두셨다.", "lab": "38-2", "pnote": "쿠윤직·네비 유누스 유적(이라크 모술 동쪽) 기준 — 확실", "route": "지중해(요나의 폭풍) → 니느웨", "cat": "m"}, {"n": 39, "per": 2, "kind": "m", "date": "BC 760", "title": "아모스 — 드고아에서 벧엘로", "note": "암 1:1; 7:10-13", "place": "벧엘", "lat": 31.9603958431248, "lon": 35.18851728280064, "col": "#C78BE8", "desc": "BC 760년, 드고아의 목자 아모스가 북이스라엘 벧엘에 가서 '정의를 물 같이, 공의를 마르지 않는 강 같이 흐르게 하라'고 외쳤으나 제사장 아마샤에게 쫓겨났다.", "lab": "39", "pnote": "베이틴 마을 기준 — 통설(엘-비레설도 있음)", "route": "드고아 → 벧엘", "cat": "m"}, {"n": 39, "per": 2, "kind": "m", "date": "BC 755–715", "title": "호세아 — 북이스라엘", "note": "호 1", "place": "사마리아", "lat": 32.276, "lon": 35.197, "col": "#C78BE8", "desc": "BC 755~715년, 선지자 호세아가 음란한 아내 고멜을 끝까지 사랑하는 삶으로, 바알을 따라간 북이스라엘을 포기하지 않으시는 하나님의 사랑을 보여 주었다.", "lab": "39", "pnote": "세바스티아 유적 기준 — 확실", "route": "", "cat": "m"}, {"n": 40, "per": 2, "kind": "m", "date": "BC 740", "title": "이사야 소명 — 웃시야 왕이 죽던 해 (웃시야·요담)", "note": "사 6", "place": "예루살렘", "lat": 31.88454159684133, "lon": 35.20676110229308, "col": "#C78BE8", "desc": "BC 740년, 웃시야 왕이 죽던 해 이사야가 성전에서 높이 들린 보좌와 스랍들을 보고 '내가 여기 있나이다 나를 보내소서'라고 응답했다. 웃시야의 아들 요담이 뒤를 이었다.", "lab": "40", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "m"}, {"n": 40, "per": 2, "kind": "m", "date": "BC 735–700", "title": "미가 — 모레셋", "note": "미 1:1", "place": "모레셋", "lat": 31.6, "lon": 34.89, "col": "#C78BE8", "desc": "BC 735~700년, 모레셋 출신 선지자 미가가 예루살렘의 불의를 책망하며 '베들레헴 에브라다야… 네게서 이스라엘을 다스릴 자가 나오리라'(미 5:2)고 메시아의 탄생지를 예언했다.", "lab": "40", "pnote": "모레셋 가드 — 텔 엘-주데이데 설, 대략 표시", "route": "", "cat": "m"}, {"n": 41, "per": 2, "kind": "k", "date": "BC 722", "title": "북이스라엘 멸망 — 앗수르로 포로 (아하스 재위 중)", "note": "왕하 17:6", "place": "하볼 강(고산)", "lat": 36.5, "lon": 40.75, "col": "#4FA3E0", "desc": "BC 722년, 앗수르가 3년 포위 끝에 사마리아를 함락하고 북이스라엘 백성을 하볼 강가 고산과 메대 성읍들로 끌어갔다. 남유다는 아하스 왕 시대였다.", "lab": "41", "pnote": "하볼(카부르) 강가 고산 = 텔 할라프(시리아 북동) 기준 — 통설", "route": "사마리아 → 하볼 강(고산)", "cat": "p2"}, {"n": 42, "per": 2, "kind": "k", "date": "BC 701", "title": "산헤립 — 라기스 함락 후 예루살렘 포위 (히스기야)", "note": "왕하 18-19", "place": "예루살렘", "lat": 31.67242732607598, "lon": 35.18055215605197, "col": "#4FA3E0", "desc": "BC 701년, 앗수르 왕 산헤립이 유다의 성읍 46개를 치고 라기스를 함락한 뒤 예루살렘을 포위했다. 히스기야 왕은 이사야와 함께 성전에서 기도했다.", "lab": "42", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "니느웨 → 라기스 → 예루살렘", "cat": "p2"}, {"n": 42, "per": 2, "kind": "m", "date": "BC 701", "title": "여호와의 사자 — 앗수르 군대 18만 5천", "note": "왕하 19:35", "place": "예루살렘", "lat": 31.8217968565652, "lon": 35.35494323371199, "col": "#C78BE8", "desc": "BC 701년, 그 밤에 여호와의 사자가 앗수르 진영에서 18만 5천 명을 쳤고, 산헤립은 니느웨로 돌아가 자기 신전에서 아들들에게 죽임을 당했다.", "lab": "42", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "m"}, {"n": 43, "per": 2, "kind": "k", "date": "BC 697–642", "title": "므낫세 — 바벨론으로 끌려갔다가 회개하고 돌아옴 (아몬)", "note": "왕하 21; 대하 33:11-13", "place": "예루살렘", "lat": 31.829568816373417, "lon": 35.11059631038659, "col": "#4FA3E0", "desc": "BC 697~642년, 히스기야의 아들 므낫세가 55년간 다스리며 성전에 아세라 목상을 세우고 자녀를 불에 태우는 최악의 죄를 지었다. 역대기는 그가 바벨론으로 끌려가 회개하고 돌아왔다고 전한다. 아들 아몬도 악을 행했다.", "lab": "43", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "예루살렘 → 바벨론 → 예루살렘", "cat": "p2"}, {"n": 44, "per": 2, "kind": "m", "date": "BC 650–630", "title": "나훔 — 니느웨 멸망 예언 / 스바냐", "note": "나 1; 습 1", "place": "니느웨", "lat": 36.3893958431248, "lon": 43.11881728280064, "col": "#C78BE8", "desc": "BC 650~630년, 선지자 나훔이 한때 회개했던 니느웨가 다시 교만해져 멸망할 것을 예언했고(BC 612 성취), 스바냐는 요시야 시대에 '여호와의 날'을 경고했다.", "lab": "44", "pnote": "쿠윤직·네비 유누스 유적(이라크 모술 동쪽) 기준 — 확실", "route": "", "cat": "m"}, {"n": 45, "per": 2, "kind": "m", "date": "BC 627", "title": "예레미야 소명 — 아나돗", "note": "렘 1", "place": "아나돗", "lat": 31.813, "lon": 35.264, "col": "#C78BE8", "desc": "BC 627년, 아나돗 제사장 가문의 청년 예레미야가 '나는 아이라'며 주저했으나, 하나님이 그 입에 말씀을 두시고 40년간 유다의 멸망과 회복을 전하게 하셨다.", "lab": "45", "pnote": "아나타 마을 인근(라스 엘-하루베) 기준 — 통설", "route": "", "cat": "m"}, {"n": 46, "per": 2, 인근) 기준 — 확실", "route": "", "cat": "p3"}, {"n": 55, "per": 3, "kind": "m", "date": "BC 551–539", "title": "가브리엘 — 다니엘에게 환상 해석 (수산 환상)", "note": "단 8:2, 16; 9:21", "place": "수산", "lat": 32.189, "lon": 48.258, "col": "#C78BE8", "desc": "BC 551~539년, 천사 가브리엘이 수산 성 환상과 70이레 예언을 다니엘에게 해석해 주었다. '기름 부음을 받은 자'가 올 때까지의 시간표가 담겨 있다(단 9:24-27).", "lab": "55", "pnote": "수사 유적(이란 슈쉬) 기준 — 확실", "route": "", "cat": "m"}, {"n": 56, "per": 3, "kind": "x", "date": "BC 539", "title": "고레스 — 바벨론 정복, 귀환 칙령(538)", "note": "스 1:1-4; 사 45:1", "place": "바벨론", "lat": 32.520710589689934, "lon": 44.332278092978534, "col": "#9A9A9A", "desc": "BC 539년, 페르시아 왕 고레스가 바벨론을 점령하고, 이듬해 '여호와의 성전을 건축하라'며 유다 포로들의 귀환을 명령했다. 이사야가 약 150년 전에 그 이름까지 예언했다(사 45:1).", "lab": "56", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "route": "바사(파사르가대) → 바벨론", "cat": "x"}, {"n": 57, "per": 3, "kind": "m", "date": "BC 536", "title": "미가엘 — 힛데겔 강가의 다니엘", "note": "단 10:4, 13, 21", "place": "힛데겔(티그리스) 강가", "lat": 33.3, "lon": 44.4, "col": "#C78BE8", "desc": "BC 536년, 고레스 3년에 다니엘이 21일 동안 금식하며 기도할 때, 힛데겔 강가에서 천사가 나타나 '너희 군주 미가엘'이 바사 군주와 싸우며 자신을 도왔다고 알려 주었다.", "lab": "57", "pnote": "힛데겔 = 티그리스 강 — 다니엘이 선 지점 불명, 바그다드 부근 강가로 임의 표시", "route": "", "cat": "m"}, {"n": 58, "per": 3, "kind": "g", "date": "BC 538", "title": "1차 귀환 — 스룹바벨·예수아", "note": "스 1-2", "place": "예루살렘", "lat": 31.743337566602914, "lon": 35.393882091178504, "col": "#5CC98A", "desc": "BC 538년, 여고냐의 손자 스룹바벨과 대제사장 예수아가 약 5만 명을 이끌고 바벨론에서 예루살렘으로 1차 귀환해 제단을 쌓고 성전 기초를 놓았다.", "lab": "58", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "바벨론 → 예루살렘", "cat": "p3"}, {"n": 59, "per": 3, "kind": "m", "date": "BC 520–516", "title": "학개·스가랴 — 성전 재건 완공(516)", "note": "스 5-6; 학 1-2", "place": "예루살렘", "lat": 31.915791051610647, "lon": 35.138491928579946, "col": "#C78BE8", "desc": "BC 520~516년, 방해로 멈췄던 성전 공사를 선지자 학개와 스가랴가 다시 일으켜, 다리오 왕 6년(BC 516)에 제2성전이 완공되었다. 성전이 불탄 지 약 70년 만이었다.", "lab": "59", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "m"}, {"n": 60, "per": 3, "kind": "g", "date": "BC 486–465", "title": "에스더·모르드개 — 수산 궁 (아비훗 세대 추정)", "note": "에 2:5-6", "place": "수산", "lat": 32.2193958431248, "lon": 48.22481728280064, "col": "#5CC98A", "desc": "BC 486~465년, 페르시아 왕 아하수에로 때 수산 궁에서 왕비가 된 에스더와 사촌 모르드개가 하만의 유대인 학살 음모를 막아 냈다. 모르드개 집안은 여고냐와 함께 끌려간 사람들이었다(에 2:6).", "lab": "60", "pnote": "수사 유적(이란 슈쉬) 기준 — 확실", "route": "", "cat": "p3"}, {"n": 61, "per": 3, "kind": "g", "date": "BC 458", "title": "에스라 귀환", "note": "스 7-8", "place": "예루살렘", "lat": 31.605248565787235, "lon": 35.21309794425192, "col": "#5CC98A", "desc": "BC 458년, 제사장이자 학사 에스라가 아닥사스다 왕의 허락을 받아 2차 귀환을 이끌고 예루살렘에 와서 율법을 가르치고 이방 혼인을 회개시켰다.", "lab": "61", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "바벨론 → 예루살렘", "cat": "p3"}, {"n": 62, "per": 3, "kind": "g", "date": "BC 445", "title": "느헤미야 — 수산에서 예루살렘으로, 성벽 52일", "note": "느 1-2, 6:15", "place": "예루살렘", "lat": 31.894181411930074, "lon": 35.37296854947378, "col": "#5CC98A", "desc": "BC 445년, 수산 궁에서 왕의 술 맡은 관원이던 느헤미야가 예루살렘 성벽이 무너졌다는 소식에 울며 기도한 뒤 총독으로 가서 52일 만에 성벽을 재건했다.", "lab": "62", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "수산 → 예루살렘", "cat": "p3"}, {"n": 63, "per": 3, "kind": "m", "date": "BC 430경", "title": "말라기 — 구약 마지막 선지자", "note": "말 3:1; 4:5", "place": "예루살렘", "lat": 31.785650216923674, "lon": 35.0500139319571, "col": "#C78BE8", "desc": "BC 430년경, 구약의 마지막 선지자 말라기가 형식적인 예배를 책망하며 '내 사자를 보내리니 그가 내 앞에서 길을 준비할 것이요'(말 3:1)라고 예언했다. 이후 약 400년간 선지자가 없었다.", "lab": "63", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "m"}, {"n": 64, "per": 3, "kind": "x", "date": "BC 334–332", "title": "알렉산더 대왕 — 동방 원정 (사독 세대 추정)", "note": "단 8:5-8 해석 참고", "place": "알렉산드리아", "lat": 31.2001, "lon": 29.9187, "col": "#9A9A9A", "desc": "BC 334~332년, 마케도니아의 알렉산더 대왕이 페르시아를 무너뜨리고 두로를 함락한 뒤 애굽에 알렉산드리아를 세웠다(요세푸스는 그가 예루살렘에 들렀다고 전함). 이후 헬라어가 세계 공용어가 된다.", "lab": "64", "pnote": "현 알렉산드리아(이집트) 기준", "route": "펠라(마케도니아) → 예루살렘 → 알렉산드리아", "cat": "x"}, {"n": 65, "per": 3, "kind": "x", "date": "BC 3세기", "title": "프톨레미 왕조 — 알렉산드리아에서 70인역 번역 (엘리웃 세대 추정)", "note": "성경 밖 역사", "place": "알렉산드리아", "lat": 31.2304958431248, "lon": 29.885517282800645, "col": "#9A9A9A", "desc": "BC 3세기, 알렉산더 사후 애굽을 차지한 프톨레미 왕조 아래 알렉산드리아에서 구약성경이 헬라어로 번역되었다(70인역). 신약 저자들이 자주 인용한 번역본이다.", "lab": "65", "pnote": "현 알렉산드리아(이집트) 기준", "route": "", "cat": "x"}, {"n": 66, "per": 3, "kind": "x", "date": "BC 167", "title": "안티오쿠스 4세 — 성전 모독 (엘르아살 세대 추정)", "note": "단 11:31 해석 참고", "place": "예루살렘", "lat": 31.64351928520154, "lon": 35.37081798700444, "col": "#9A9A9A", "desc": "BC 167년, 시리아 셀류시드 왕 안티오쿠스 4세 에피파네스가 예루살렘 성전에 제우스 제단을 세우고 부정한 제물을 바쳐 성전을 더럽히고 율법을 금지했다.", "lab": "66", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "안디옥 → 예루살렘", "cat": "x"}, {"n": 67, "per": 3, "kind": "x", "date": "BC 164", "title": "마카비 — 성전 정화, 수전절(하누카)", "note": "요 10:22", "place": "예루살렘", "lat": 31.9740347047613, "lon": 35.22620263787266, "col": "#9A9A9A", "desc": "BC 164년, 모데인의 제사장 맛디아의 아들 유다 마카비가 예루살렘을 되찾아 성전을 정결하게 하고 다시 봉헌했다. 이것이 수전절(하누카)의 기원이다(요 10:22).", "lab": "67", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "모데인 → 예루살렘", "cat": "x"}, {"n": 68, "per": 3, "kind": "x", "date": "BC 63", "title": "로마 폼페이우스 — 예루살렘 점령 (야곱 세대 추정)", "note": "성경 밖 역사", "place": "예루살렘", "lat": 31.623491731792427, "lon": 35.10657343673817, "col": "#9A9A9A", "desc": "BC 63년, 로마 장군 폼페이우스가 하스몬 왕조의 내분을 틈타 예루살렘을 점령하고 지성소에까지 들어갔다. 이때부터 유대는 로마의 지배를 받는다.", "lab": "68", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "로마 → 예루살렘", "cat": "x"}, {"n": 69, "per": 3, "kind": "k", "date": "BC 37–4", "title": "헤롯 대왕 — 성전 증축 (요셉 세대)", "note": "요 2:20", "place": "예루살렘", "lat": 31.80575607456624, "lon": 35.439752982702935, "col": "#5CC98A", "desc": "BC 37~4년, 로마가 세운 에돔 출신 헤롯 대왕이 BC 20년경부터 성전을 대대적으로 증축했다. 예수님 시대의 '46년 동안 지은 성전'이 바로 이것이다(요 2:20).", "lab": "69", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "p3"}, {"n": 70, "per": 3, "kind": "m", "date": "BC 7경", "title": "가브리엘 — 성전의 사가랴에게", "note": "눅 1:11-19", "place": "예루살렘", "lat": 31.898507867067686, "lon": 35.06204503021773, "col": "#C78BE8", "desc": "BC 7년경, 성전에서 분향하던 제사장 사가랴에게 천사 가브리엘이 나타나, 늙은 아내 엘리사벳이 엘리야의 심령으로 주의 길을 예비할 아들 요한을 낳을 것이라 알렸다.", "lab": "70", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "", "cat": "m"}, {"n": 71, "per": 3, "kind": "m", "date": "BC 6경", "title": "가브리엘 — 나사렛의 마리아에게", "note": "눅 1:26-38", "place": "나사렛", "lat": 32.6996, "lon": 35.3035, "col": "#C78BE8", "desc": "BC 6년경, 천사 가브리엘이 갈릴리 나사렛의 처녀 마리아에게 나타나 '성령이 네게 임하시고… 나실 바 거룩한 이는 하나님의 아들이라'며 예수님의 잉태를 알렸다.", "lab": "71", "pnote": "수태고지 교회 기준", "route": "", "cat": "m"}, {"n": 72, "per": 3, "kind": "g", "date": "BC 6–4", "title": "요셉과 마리아, 베들레헴으로 — 예수 탄생", "note": "눅 2:1-7; 마 1:18-25", "place": "베들레헴", "lat": 31.64200447249227, "lon": 35.207968401208326, "col": "#5CC98A", "desc": "BC 6~4년, 아우구스투스의 호적 명령으로 다윗의 자손 요셉이 약혼자 마리아와 나사렛에서 베들레헴으로 내려갔고, 그곳 구유에서 예수님이 태어나셨다(미 5:2 성취).", "lab": "72", "pnote": "현 베들레헴(예수 탄생 교회) 기준", "route": "나사렛 → 베들레헴", "cat": "p3"}, {"n": 73, "per": 3, "kind": "m", "date": "AD 28–29", "title": "세례 요한 — 요단강에서 주의 길을 예비", "note": "마 3; 요 1:28", "place": "요단강 베다니", "lat": 31.837, "lon": 35.551, "col": "#C78BE8", "desc": "AD 28~29년경, 사가랴의 아들 세례 요한이 요단강 건너편 베다니에서 회개의 세례를 베풀며 '보라 세상 죄를 지고 가는 하나님의 어린 양이로다'라고 예수님을 가리켰다.", "lab": "73", "pnote": "알-마그타스(요르단 쪽 세례 터, 유네스코 2015) — '요단강 건너편 베다니'(요 1:28) 전통 위치", "route": "", "cat": "m"}, {"n": 74, "per": 3, "kind": "g", "date": "AD 30–33", "title": "예수 그리스도 — 예루살렘, 십자가와 부활", "note": "마 26-28", "place": "예루살렘", "lat": 31.567589936418543, "lon": 35.28294485388485, "col": "#5CC98A", "desc": "AD 30~33년경, 나사렛에서 자라신 예수님이 예루살렘에 올라가 유월절에 십자가에 못 박히시고 사흘 만에 부활하셨다. 그 순간 성소 휘장이 위에서 아래로 찢어졌다(마 27:51).", "lab": "74", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "route": "나사렛 → 예루살렘", "cat": "p3"}], "paths": [{"n": 2, "title": "데라와 함께 하란으로", "col": "#F2C14E", "pts": [[30.9626, 46.1031], [31.338341939999996, 45.81678236], [31.705597360000002, 45.52338184], [32.06436626, 45.22 function arrowMk(p){const a=p.pts[p.pts.length-2],b=p.pts[p.pts.length-1];const A=map.project(a,6),B=map.project(b,6);const deg=Math.atan2(B.y-A.y,B.x-A.x)*180/Math.PI;return L.marker(b,{interactive:false,keyboard:false,icon:L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],html:`<svg width="14" height="14" viewBox="0 0 14 14" style="overflow:visible;transform:rotate(${deg}deg)"><polygon points="7,7 -2,2.5 -2,11.5" fill="${p.col}" stroke="#111" stroke-width=".6"/></svg>`})})}

function animatePaths(n,ms){items.filter(it=>it.type==='p'&&it.n===n&&vis[it.cat]).forEach(it=>{
  map.removeLayer(it.layer);const pl=L.polyline([it.d.pts[0]],{color:it.d.col,weight:5,opacity:1}).addTo(map);anims.push(pl);
  const t0=performance.now();(function step(t){const k=Math.min(1,(t-t0)/ms);const upto=Math.max(1,Math.round(k*(it.d.pts.length-1)));
    pl.setLatLngs(it.d.pts.slice(0,upto+1));if(k<1&&mode==='play')requestAnimationFrame(step);else{map.removeLayer(pl);if(shown(it))it.layer.addTo(map);}})(t0);});}
function numbersInRange(){return [...new Set(items.filter(it=>vis[it.cat]&&it.n>=s0&&it.n<=s1).map(it=>it.n))].sort((a,b)=>a-b)}
let seq=[],si=0;
function LB(n){const m=items.find(it=>it.type==='m'&&it.n===n);return m?m.d.lab:n}
function showAt(i,manual){cur=seq[i];si=i+1;const iv=Math.max(300,+$('iv').value||2500);
  anims.forEach(a=>map.removeLayer(a));anims=[];
  render(false);animatePaths(cur,Math.min(iv*0.55,1200));caption(cur);fitShown(Math.min(1.6,iv/1000*0.6));
  items.forEach(it=>{if(it.type==='m')it.el.classList.toggle('act',it.n===cur)});
  const a=items.find(it=>it.type==='m'&&it.n===cur);if(a)a.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstChild.style.width=((i+1)/seq.length*100)+'%';
  $('st').textContent=`${manual?'수동':'재생 중'} — ${LB(cur)} (${i+1}/${seq.length})`;}
function tick(){if(paused)return;if(si>=seq.length){$('st').textContent=`완료 — ${s0}~${s1}`;timer=null;return}
  const iv=Math.max(300,+$('iv').value||2500);showAt(si,false);timer=setTimeout(tick,iv);}
function initSeq(){s0=Math.max(1,Math.min(74,+$('s0').value||1));s1=Math.max(1,Math.min(74,+$('s1').value||74));if(s0>s1)[s0,s1]=[s1,s0];
  mode='play';seq=numbersInRange();si=0;cur=s0-1;}
function manualStep(dir){clearTimeout(timer);timer=null;
  if(mode!=='play'){initSeq();paused=true;if(!seq.length)return;showAt(dir>0?0:seq.length-1,true);return}
  paused=true;const curIdx=si-1;const t=curIdx+dir;
  if(t<0||t>=seq.length){$('st').textContent=`${t<0?'처음':'마지막'} 단계입니다 — ${LB(cur)}`;return}
  showAt(t,true);}
function startFrom(n){clearTimeout(timer);timer=null;$('s0').value=n;if((+$('s1').value||74)<n)$('s1').value=74;
  initSeq();paused=true;if(!seq.length)return;anims.forEach(a=>map.removeLayer(a));anims=[];showAt(0,true);
  $('st').textContent=`${n}번부터 시작 — Next ▶ 로 이어가기 (1/${seq.length})`;}
$('bNext').onclick=()=>manualStep(1);
$('bPrev').onclick=()=>manualStep(-1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){manualStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){manualStep(-1);e.preventDefault()}
  else if(e.key===' '){(mode==='play'&&!paused)?$('bPause').click():$('bPlay').click();e.preventDefault()}});
$('bPlay').onclick=()=>{if(mode==='play'&&paused){paused=false;$('st').textContent='재생 재개';tick();return}
  if(mode==='play'&&timer)return;
  initSeq();paused=false;render(false);tick();};
$('bPause').onclick=()=>{if(mode!=='play')return;paused=true;clearTimeout(timer);timer=null;$('st').textContent=`일시정지 — ${LB(cur)}`};
$('bStop').onclick=()=>{clearTimeout(timer);timer=null;paused=false;mode='all';anims.forEach(a=>map.removeLayer(a));anims=[];
  $('cap').classList.remove('show');$('prog').firstChild.style.width='0';items.forEach(it=>it.el&&it.el.classList.remove('act'));
  render(true);$('st').textContent='정지 — 전체 보기';};
render(false);map.fitBounds([[27.5,29],[37.5,49]]);
</script></body></html>
