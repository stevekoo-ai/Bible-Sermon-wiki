힐라 인근) 기준 — 확실", "col": "#E8955F", "route": "예루살렘 → 바벨론", "lat": 32.5667958431248, "lon": 44.387717282800644, "folder": "바벨론 (침공·포로)"}, {"n": 9.0, "lab": "9", "cat": "king", "date": "BC 597 봄", "title": "시드기야(21세) 즉위", "note": "왕하 24:17-19; 렘 52:1-2", "desc": "느부갓네살이 여호야긴의 삼촌 맛다니야의 이름을 시드기야로 바꿔 21세에 왕으로 세웠다. 어머니는 립나 사람 하무달. 그도 여호와 보시기에 악을 행했다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#4FA3E0", "route": "", "lat": 31.67242732607598, "lon": 35.18055215605197, "folder": "유다 왕실"}, {"n": 10.0, "lab": "10", "cat": "king", "date": "BC 589경", "title": "시드기야의 배반", "note": "왕하 24:20; 렘 52:3; 겔 17:13-19", "desc": "BC 589년경, 시드기야가 하나님의 이름으로 한 맹세를 깨고 애굽을 의지해 바벨론을 배반했다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#4FA3E0", "route": "", "lat": 31.8217968565652, "lon": 35.35494323371199, "folder": "유다 왕실"}, {"n": 11.0, "lab": "11", "cat": "text", "date": "BC 588.1.15 (시드기야 9년 10월 10일)", "title": "예루살렘 포위 시작", "note": "왕하 25:1; 렘 39:1; 52:4; 겔 24:1-2", "desc": "BC 588년 1월 15일, 느부갓네살이 모든 군대를 이끌고 와서 예루살렘 둘레에 토성을 쌓고 포위했다. 바벨론의 에스겔도 같은 날을 기록했다. 왕은 시리아의 립나에 본진을 두었다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF4D4D", "route": "바벨론 → 립나 → 예루살렘", "lat": 31.829568816373417, "lon": 35.11059631038659, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 12.0, "lab": "12", "cat": "jer", "date": "BC 588~586 (포위 중)", "title": "감옥의 예레미야, 에벳멜렉 구원 약속", "note": "렘 39:15-18; 38:7-13", "desc": "포위가 이어지던 중, 궁중 감옥 뜰에 갇힌 예레미야에게 하나님이 구스 사람 에벳멜렉을 위한 말씀을 주셨다. 그는 진흙 구덩이에서 예레미야를 건져낸 사람이었다. '네가 나를 신뢰하였으니 칼에 죽지 않고 살리라.'", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.649233939933254, "lon": 35.29576173094664, "folder": "예레미야·에벳멜렉"}, {"n": 13.0, "lab": "13", "cat": "text", "date": "BC 586.7.18 (11년 4월 9일)", "title": "기근, 그리고 성벽이 뚫림", "note": "왕하 25:2-4; 렘 39:2-3; 52:5-7", "desc": "BC 586년 7월 18일, 18개월 포위 끝에 성 안의 식량이 다 떨어지고 성벽이 뚫렸다. 바벨론 대신들이 들어와 중문에 앉았다—네르갈사레셀, 삼갈느보, 살스김(이 이름이 새겨진 바벨론 토판이 2007년 확인됨).", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF4D4D", "route": "", "lat": 31.920525252065747, "lon": 35.280009949271516, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 14.0, "lab": "14", "cat": "text", "date": "BC 586.7.18 밤", "title": "유다 군대의 야간 도주 — 시드기야도 함께", "note": "왕하 25:4; 렘 39:4; 52:7", "desc": "그날 밤, 바벨론 군대가 성을 에워싸고 있는데도 유다 군대가 왕의 동산 곁 '두 성벽 사이의 문'으로 빠져나가 요단 계곡(아라바) 쪽으로 도망했다. 시드기야 왕도 함께였다(렘 39:4).", "place": "아라바 길(광야)", "pnote": "예루살렘에서 여리고·요단 계곡으로 내려가는 광야 길 위 임의 지점 — 도주 방향 표시용", "col": "#FF4D4D", "route": "예루살렘 → 아라바 길(광야)", "lat": 31.81, "lon": 35.34, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 15.0, "lab": "15", "cat": "text", "date": "BC 586.7월 하순", "title": "여리고 평지에서 시드기야 생포", "note": "왕하 25:5; 렘 39:5; 52:8", "desc": "바벨론 군대가 뒤쫓아와 여리고 평지에서 시드기야를 사로잡았고, 그의 군대는 뿔뿔이 흩어졌다. 여리고는 이스라엘이 처음 가나안에 들어와 무너뜨린 성이었다.", "place": "여리고", "pnote": "텔 에스-술탄 유적 기준", "col": "#FF4D4D", "route": "아라바 길(광야) → 여리고", "lat": 31.8711, "lon": 35.444, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 16.0, "lab": "16", "cat": "text", "date": "BC 586.7~8월", "title": "립나의 심판 — 아들들의 죽음, 두 눈이 뽑힘", "note": "왕하 25:6-7; 렘 39:5-7; 52:9-11", "desc": "시드기야는 하맛 땅 립나로 끌려가 느부갓네살 앞에서 심문을 받았다. 그의 눈앞에서 아들들과 유다의 대신들이 처형되었고, 그 후 그의 두 눈이 뽑혔다.", "place": "립나", "pnote": "시리아 립나(리블라) 유적 기준 — 확실", "col": "#FF4D4D", "route": "여리고 → 립나", "lat": 34.48, "lon": 36.38, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 16.0, "lab": "16", "cat": "text", "date": "BC 586 이후", "title": "시드기야, 바벨론 감옥에서 죽을 때까지", "note": "렘 52:11; 34:3; 겔 12:13", "desc": "쇠사슬에 묶인 시드기야는 바벨론으로 끌려가 죽는 날까지 감옥에 갇혔다. '바벨론 왕의 눈을 보리라'(렘 34:3)와 '그 땅을 보지 못하리라'(겔 12:13)가 둘 다 이루어졌다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF4D4D", "route": "립나 → 바벨론", "lat": 32.47300447249227, "lon": 44.42646840120833, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 17.0, "lab": "17", "cat": "text", "date": "BC 586.8.14 (19년 5월 7일 · 렘 52:12은 10일=8.17)", "title": "★ 성전이 불타던 날", "note": "왕하 25:8-10; 렘 39:8; 52:12-14", "desc": "경호대장 느부사라단이 예루살렘에 와서 여호와의 성전과 왕궁, 모든 집과 큰 건물을 불사르고 성벽을 헐었다. 렘 52:12은 10일로 기록(7일 도착·10일 방화로 보기도 함). 솔로몬 성전이 선 지 약 370년 만이었고, 유대인은 지금도 아브월 9일에 금식하며 이날을 기억한다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#FF4D4D", "route": "립나 → 예루살렘", "lat": 31.699878789234408, "lon": 35.10056142174301, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 18.0, "lab": "18", "cat": "bab", "date": "BC 586.8월", "title": "성전 기구 약탈 — 놋기둥·놋바다·놋소", "note": "왕하 25:13-17; 렘 52:17-23", "desc": "솔로몬이 만든 놋기둥 두 개(높이 8.1m, 둘레 5.4m, 속이 빈 기둥, 석류 장식 각 100개), 놋바다와 그것을 받친 놋소 열두 마리, 놋받침을 깨뜨려 가져갔다. 놋이 너무 많아 무게를 달 수 없었다. 기둥머리 높이는 왕하 3규빗, 렘 5규빗으로 다르게 적혀 있다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#E8955F", "route": "예루살렘 → 바벨론", "lat": 32.598260287903464, "lon": 44.46831629235296, "folder": "바벨론 (침공·포로)"}, {"n": 19.0, "lab": "19", "cat": "text", "date": "BC 586.8월", "title": "남은 백성 포로 — 가장 가난한 자만 남음", "note": "왕하 25:11-12; 렘 39:9-10; 52:15-16, 29", "desc": "느부사라단이 성에 남은 백성과 항복한 사람들을 포로로 끌고 갔다. 포로들은 예루살렘 북쪽 라마에 모였다가 떠났다(렘 40:1). 가장 가난한 사람들만 남겨 포도원과 밭을 맡겼다. 렘 52:29은 이때 예루살렘 사람 832명이라고 기록한다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#FF4D4D", "route": "예루살렘 → 라마 → 바벨론", "lat": 32.520710589689934, "lon": 44.332278092978534, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 20.0, "lab": "20", "cat": "jer", "date": "BC 586.8월", "title": "예레미야, 궁중 감옥에서 풀려남 · 에벳멜렉 구원", "note": "렘 39:11-14", "desc": "느부갓네살이 예레미야를 잘 돌보라고 명령했고, 바벨론 대신들이 그를 궁중 감옥에서 꺼내 그달랴에게 맡겼다. 에벳멜렉에게 하신 구원의 약속도 이루어졌다.", "place": "예루살렘", "pnote": "성전산(모리아산) 기준 — 같은 곳의 여러 사건은 조금씩 흩어 표시", "col": "#C78BE8", "route": "", "lat": 31.743337566602914, "lon": 35.393882091178504, "folder": "예레미야·에벳멜렉"}, {"n": 21.0, "lab": "21", "cat": "jer", "date": "BC 586.8월", "title": "라마에서 쇠사슬이 풀림 → 미스바로", "note": "렘 40:1-6", "desc": "예레미야는 다시 포로 행렬에 섞여 쇠사슬에 묶인 채 라마까지 끌려갔다. 느부사라단이 그를 풀어 주며 '네 하나님이 말씀하신 대로 행하셨다'고 말하고, 양식과 선물을 주어 보냈다. 예레미야는 미스바의 그달랴에게 갔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#C78BE8", "route": "라마 → 미스바", "lat": 31.887, "lon": 35.217, "folder": "예레미야·에벳멜렉"}, {"n": 22.0, "lab": "22", "cat": "text", "date": "BC 586.8월", "title": "지도자들 처형 — '유다가 본토에서 떠났더라'", "note": "왕하 25:18-21; 렘 52:24-27", "desc": "대제사장 스라야, 부제사장 스바냐, 성전 문지기 세 명, 군 지휘관, 왕의 보좌관(왕하 5명·렘 7명), 징집 서기관, 백성 60명이 립나로 끌려가 처형되었다. '이와 같이 유다가 사로잡혀 본토에서 떠났더라'(왕하 25:21).", "place": "립나", "pnote": "시리아 립나(리블라) 유적 기준 — 확실", "col": "#FF4D4D", "route": "예루살렘 → 립나", "lat": 34.5103958431248, "lon": 36.34681728280064, "folder": "★ 10/18 본문 (왕하 25:1-12, 21)"}, {"n": 23.0, "lab": "23", "cat": "rem", "date": "BC 586", "title": "그달랴, 유다 총독이 됨", "note": "왕하 25:22; 렘 40:5", "desc": "느부갓네살이 사반의 손자, 아히감의 아들 그달랴를 총독으로 세워 남은 사람들을 다스리게 했다. 그의 집안은 예레미야를 보호했던 가문이었다(렘 26:24).", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "", "lat": 31.9173958431248, "lon": 35.18381728280064, "folder": "그달랴와 남은 자들"}, {"n": 24.0, "lab": "24", "cat": "rem", "date": "BC 586 여름~가을", "title": "지휘관들이 모임 — 그달랴의 맹세", "note": "왕하 25:23-24; 렘 40:7-10", "desc": "들에 숨어 있던 지휘관들—이스마엘, 요하난, 스라야, 야아사냐—이 미스바로 왔다. 그달랴는 '바벨론 왕을 섬기면 무사할 것이니 이 땅에 정착해 포도주와 여름 과일과 기름을 거두라'고 맹세했다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "", "lat": 31.82360447249227, "lon": 35.22256840120833, "folder": "그달랴와 남은 자들"}, {"n": 25.0, "lab": "25", "cat": "rem", "date": "BC 586 가을", "title": "흩어진 유대인들의 귀환과 풍성한 수확 (모압)", "note": "렘 40:11-12", "desc": "모압·암몬·에돔 등 각지로 흩어졌던 유대인들이 그달랴 소식을 듣고 돌아왔다. 그해 그들은 포도주와 여름 과일을 아주 많이 거두었다—심판 뒤에 주어진 짧은 회복의 계절이었다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "모압 → 미스바", "lat": 31.948860287903464, "lon": 35.264416292352955, "folder": "그달랴와 남은 자들"}, {"n": 25.0, "lab": "25", "cat": "rem", "date": "BC 586 가을", "title": "암몬에서 돌아옴", "note": "렘 40:11", "desc": "암몬 땅에 피했던 유대인들도 돌아왔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "암몬(랍바) → 미스바", "lat": 31.871310589689934, "lon": 35.12837809297853, "folder": "그달랴와 남은 자들"}, {"n": 25.0, "lab": "25", "cat": "rem", "date": "BC 586 가을", "title": "에돔에서 돌아옴", "note": "렘 40:11", "desc": "에돔 땅에 피했던 유대인들도 돌아왔다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "에돔(보스라) → 미스바", "lat": 31.833008391620954, "lon": 35.301911166666365, "folder": "그달랴와 남은 자들"}, {"n": 26.0, "lab": "26", "cat": "rem", "date": "BC 586 가을", "title": "요하난의 경고, 믿지 않은 그달랴", "note": "렘 40:13-16", "desc": "요하난이 '암몬 왕 바알리스가 당신을 죽이려고 이스마엘을 보냈다'고 경고하며 몰래 이스마엘을 죽이겠다고 했지만, 그달랴는 믿지 않고 막았다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "", "lat": 31.993441596841333, "lon": 35.18836110229308, "folder": "그달랴와 남은 자들"}, {"n": 27.0, "lab": "27", "cat": "rem", "date": "BC 586.10월경 (식사 중 · 582년설도)", "title": "그달랴 암살", "note": "왕하 25:25; 렘 41:1-3", "desc": "그해 일곱째 달(티쉬리월), 왕족 이스마엘이 부하 10명과 함께 미스바에서 그달랴와 식사하던 중 일어나 그를 칼로 죽이고, 함께 있던 유대인과 바벨론 군인들까지 죽였다. 유대인은 지금도 티쉬리월 3일을 '그달랴 금식일'로 지킨다. BC 582년으로 보는 학자들도 있다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "암몬(랍바) → 미스바", "lat": 31.78132732607598, "lon": 35.16215215605197, "folder": "그달랴와 남은 자들"}, {"n": 28.0, "lab": "28", "cat": "rem", "date": "다음 날", "title": "성전으로 가던 순례자 80명 학살 (세겜)", "note": "렘 41:4-9", "desc": "다음 날, 수염을 깎고 옷을 찢은 채 소제물과 향을 들고 무너진 성전으로 가던 80명이 세겜·실로·사마리아에서 왔다. 이스마엘은 울며 맞으러 나가 그들을 성 안으로 끌어들여 죽이고 아사 왕이 판 구덩이에 던졌다. 숨겨 둔 곡식이 있다고 한 10명만 살려 주었다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "세겜 → 미스바", "lat": 31.930696856565202, "lon": 35.33654323371199, "folder": "그달랴와 남은 자들"}, {"n": 28.0, "lab": "28", "cat": "rem", "date": "다음 날", "title": "실로에서 온 순례자들", "note": "렘 41:5", "desc": "실로에서 온 순례자들도 함께였다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "실로 → 미스바", "lat": 31.93846881637342, "lon": 35.09219631038659, "folder": "그달랴와 남은 자들"}, {"n": 28.0, "lab": "28", "cat": "rem", "date": "다음 날", "title": "사마리아에서 온 순례자들", "note": "렘 41:5", "desc": "사마리아에서 온 순례자들도 함께였다.", "place": "미스바", "pnote": "텔 엔-나스베 유적 기준 — 통설(네비 삼윌설도 있음)", "col": "#5CC98A", "route": "사마리아 → 미스바", "lat": 31.758133939933256, "lon": 35.27736173094664, "folder": "그달랴와 남은 자들"}, {"n": 29.0, "lab": "29", "cat": "rem", "date": "직후", "title": "이스마엘, 백성을 사로잡아 암몬으로", "note": "렘 41:10", "desc": "이스마엘이 왕의 딸들과 미스바에 남은 백성을 모두 사로잡아 암몬 땅으로 떠났다.", "place": "기브온", "pnote": "엘-지브 유적 기준 — '기브온 큰 못'(바위 우물) 발굴로 확인", "col": "#5CC98A", "route": "미스바 → 기브온", "lat": 31.847, "lon": 35.185, "folder": "그달랴와 남은 자들"}, {"n": 30.0, "lab": "30", "cat": "rem", "date": "직후", "title": "기브온 큰 못가의 구출", "note": "렘 41:11-14", "desc": "요하난과 지휘관들이 뒤쫓아 기브온 큰 못가에서 이스마엘을 따라잡았다. 끌려가던 백성들이 요하난을 보고 기뻐하며 달려갔다. 기브온 큰 못은 발굴로 확인된 거대한 바위 우물이다.", "place": "기브온", "pnote": "엘-지브 유적 기준 — '기브온 큰 못'(바위 우물) 발굴로 확인", "col": "#5CC98A", "route": "", "lat": 31.877395843124802, "lon": 35.15181728280064, "folder": "그달랴와 남은 자들"}, {"n": 30.0, "lab": "30", "cat": "rem", "date": "직후", "title": "이스마엘과 8명, 암몬으로 도주", "note": "렘 41:15", "desc": "이스마엘은 부하 8명과 함께 요하난을 피해 암몬으로 도망쳤다.", "place": "암몬(랍바)", "pnote": "랍바(현 요르단 암만 성채) — 암몬 수도", "col": "#5CC98A", "route": "기브온 → 암몬(랍바)", "lat": 31.954, "lon": 35.934, "folder": "그달랴와 남은 자들"}, {"n": 31.0, "lab": "31", "cat": "rem", "date": "BC 586 말", "title": "베들레헴 근처 게룻김함에 머묾", "note": "렘 41:16-18", "desc": "요하난 일행은 바벨론의 보복이 두려워 애굽으로 가려고 베들레헴 근처 게룻김함에 머물렀다.", "place": "게룻김함", "pnote": "위치 불명 — '베들레헴 근처'(렘 41:17), 베들레헴 북쪽으로 임의 표시", "col": "#5CC98A", "route": "기브온 → 게룻김함", "lat": 31.73, "lon": 35.215, "folder": "그달랴와 남은 자들"}, {"n": 32.0, "lab": "32", "cat": "jer", "date": "BC 586 말", "title": "기도 요청 — '무슨 말씀이든 순종하겠습니다'", "note": "렘 42:1-6", "desc": "지휘관들과 온 백성이 예레미야에게 와서 '하나님 말씀이 좋든 싫든 그대로 순종하겠다'고 맹세하며 기도를 부탁했다.", "place": "게룻김함", "pnote": "위치 불명 — '베들레헴 근처'(렘 41:17), 베들레헴 북쪽으로 임의 표시", "col": "#C78BE8", "route": "", "lat": 31.7603958431248, "lon": 35.181817282800644, "folder": "예레미야·에벳멜렉"}, {"n": 33.0, "lab": "33", "cat": "jer", "date": "10일 후", "title": "하나님의 응답 — '이 땅에 머물라'", "note": "렘 42:7-22", "desc": "열흘 뒤 하나님의 응답이 왔다. '이 땅에 머물면 내가 너희를 세우고 헐지 않으리라. 바벨론 왕을 두려워 말라. 그러나 애굽으로 가면 너희가 두려워하는 칼과 기근이 거기까지 따라가리라.'", "place": "게룻김함", "pnote": "위치 불명 — '베들레헴 근처'(렘 41:17), 베들레헴 북쪽으로 임의 표시", "col": "#C78BE8", "route": "", "lat": 31.66660447249227, "lon": 35.22056840120833, "folder": "예레미야·에벳멜렉"}, {"n": 34.0, "lab": "34", "cat": "rem", "date": "BC 586 말 (또는 582)", "title": "말씀을 거부하고 애굽 다바네스로", "note": "렘 43:1-7", "desc": "그들은 '당신은 거짓말을 한다, 바룩이 선동했다'며 말씀을 거부하고 예레미야와 바룩까지 데리고 애굽 다바네스로 내려갔다. 출애굽으로 나왔던 그 땅으로 스스로 돌아간 것이다.", "place": "다바네스", "pnote": "텔 데펜네(나일 삼각주 동부) 기준 — 통설", "col": "#5CC98A", "route": "게룻김함 → 다바네스", "lat": 30.972, "lon": 32.2, "folder": "그달랴와 남은 자들"}, {"n": 35.0, "lab": "35", "cat": "jer", "date": "다바네스에서", "title": "바로 궁 입구에 돌을 묻는 예언", "note": "렘 43:8-10", "desc": "다바네스에서 예레미야는 사람들이 보는 앞에서 바로 궁 입구 벽돌 바닥에 큰 돌들을 묻었다. '바벨론 왕이 와서 이 돌 위에 보좌를 놓으리라.'", "place": "다바네스", "pnote": "텔 데펜네(나일 삼각주 동부) 기준 — 통설", "col": "#C78BE8", "route": "", "lat": 31.002395843124802, "lon": 32.16681728280064, "folder": "예레미야·에벳멜렉"}, {"n": 35.0, "lab": "35", "cat": "jer", "date": "다바네스에서", "title": "헬리오폴리스의 주상이 깨지리라", "note": "렘 43:11-13", "desc": "'그가 애굽 신전들을 불사르고 헬리오폴리스(벧세메스)의 주상들을 깨뜨리리라.'", "place": "헬리오폴리스", "pnote": "헬리오폴리스(온·벧세메스, 현 카이로 마타리야 오벨리스크) 기준 — 확실", "col": "#C78BE8", "route": "다바네스 → 헬리오폴리스", "lat": 30.129, "lon": 31.307, "folder": "예레미야·에벳멜렉"}, {"n": 36.0, "lab": "36", "cat": "bab", "date": "BC 582/581 (느부갓네살 23년)", "title": "3차 포로 — 745명", "note": "렘 52:30", "desc": "BC 582년, 느부사라단이 유다 사람 745명을 또 잡아갔다. 세 차례 포로 합계 4,600명(렘 52:28-30). 그달랴 암살에 대한 바벨론의 보복으로 보는 견해가 있다.", "place": "바벨론", "pnote": "바빌론 유적(이라크 힐라 인근) 기준 — 확실", "col": "#E8955F", "route": "예루살렘 → 바벨론", "lat": 32.48240839162095, "lon": 44.50581116666637, "folder": "바벨론 (침공·포로)"}, {"n": 37.0, "lab": "37", "cat": "bab", "date": "BC 568/567 (느부갓네살 function fitShown(dur){const pts=[];items.forEach(it=>{if(map.hasLayer(it.layer))pts.push(...it.ll)});
  if(!pts.length)return;const b=L.latLngBounds(pts);
  const small=b.getNorthEast().distanceTo(b.getSouthWest())<30000;
  const z=small?8:Math.min(8.5,map.getBoundsZoom(b,false,L.point(140,140)));const c=b.getCenter();
  if(map.getCenter().distanceTo(c)<800&&Math.abs(map.getZoom()-z)<0.1)return;
  try{map.flyTo(c,z,{duration:dur||1.0})}catch(e){map.setView(c,z)}}
function caption(n){const ms=items.filter(it=>it.type==='m'&&it.n===n&&vis[it.cat]).map(it=>it.d);const c=$('cap');
  if(!ms.length){c.classList.remove('show');return}
  const m0=ms[0];c.querySelector('.big').textContent=m0.lab;c.querySelector('.big').style.background=m0.col;
  c.querySelector('.dt').textContent=m0.date+' · '+[...new Set(ms.map(m=>m.place))].join(' / ');
  c.querySelector('.tx').innerHTML=ms.map(m=>`<div class="tt">${m.title}</div><div class="ds">${m.desc}</div>`).join('');
  c.querySelector('.nt').textContent='📖 '+[...new Set(ms.map(m=>m.note))].join(' · ');
  const seen=new Set();c.querySelector('.pl').innerHTML=ms.filter(m=>{const key=m.place+m.route;if(seen.has(key))return false;seen.add(key);return true}).map(m=>`📍 <b>${m.place}</b> — ${m.pnote}`+(m.route?`<br><span style="color:#888">경로: ${m.route}</span>`:'')).join('<br>');
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show');}
function animatePaths(n,ms){items.filter(it=>it.type==='p'&&it.n===n&&vis[it.cat]).forEach(it=>{
  map.removeLayer(it.layer);const pl=L.polyline([it.d.pts[0]],{color:it.d.col,weight:5,opacity:1}).addTo(map);anims.push(pl);
  const t0=performance.now();(function step(t){const k=Math.min(1,(t-t0)/ms);const upto=Math.max(1,Math.round(k*(it.d.pts.length-1)));
    pl.setLatLngs(it.d.pts.slice(0,upto+1));if(k<1&&mode==='play')requestAnimationFrame(step);else{map.removeLayer(pl);if(shown(it))it.layer.addTo(map);}})(t0);});}
function numbersInRange(){return [...new Set(items.filter(it=>vis[it.cat]&&it.n>=s0&&it.n<=s1).map(it=>it.n))].sort((a,b)=>a-b)}
let seq=[],si=0;
function LB(n){const m=items.find(it=>it.type==='m'&&it.n===n);return m?m.d.lab:n}
function showAt(i,manual){cur=seq[i];si=i+1;const iv=Math.max(300,+$('iv').value||2500);
  anims.forEach(a=>map.removeLayer(a));anims=[];
  render(false);animatePaths(cur,Math.min(iv*0.55,1200));caption(cur);fitShown(Math.min(1.6,iv/1000*0.6));
  items.forEach(it=>{if(it.type==='m')it.el.classList.toggle('act',it.n===cur)});
  const a=items.find(it=>it.type==='m'&&it.n===cur&&vis[it.cat]);if(a)a.el.scrollIntoView({block:'center',behavior:'smooth'});
  $('prog').firstChild.style.width=((i+1)/seq.length*100)+'%';
  $('st').textContent=`${manual?'수동':'재생 중'} — ${LB(cur)} (${i+1}/${seq.length})`;}
function tick(){if(paused)return;if(si>=seq.length){$('st').textContent=`완료 — ${LB(seq[0])}~${LB(seq[seq.length-1])}`;timer=null;return}
  const iv=Math.max(300,+$('iv').value||2500);showAt(si,false);timer=setTimeout(tick,iv);}
function initSeq(){s0=Math.max(KMIN,Math.min(KMAX,+$('s0').value||KMIN));s1=Math.max(KMIN,Math.min(KMAX,+$('s1').value||KMAX));if(s0>s1)[s0,s1]=[s1,s0];
  mode='play';seq=numbersInRange();si=0;cur=s0-1;}
function manualStep(dir){clearTimeout(timer);timer=null;
  if(mode!=='play'){initSeq();paused=true;if(!seq.length)return;showAt(dir>0?0:seq.length-1,true);return}
  paused=true;const curIdx=si-1;const t=curIdx+dir;
  if(t<0||t>=seq.length){$('st').textContent=`${t<0?'처음':'마지막'} 단계입니다 — ${LB(cur)}`;return}
  showAt(t,true);}
function startFrom(n){clearTimeout(timer);timer=null;$('s0').value=n;if((+$('s1').value||KMAX)<n)$('s1').value=KMAX;
  initSeq();paused=true;if(!seq.length)return;anims.forEach(a=>map.removeLayer(a));anims=[];showAt(0,true);
  $('st').textContent=`${LB(n)}번부터 시작 — Next ▶ 로 이어가기 (1/${seq.length})`;}
$('bNext').onclick=()=>manualStep(1);
$('bPrev').onclick=()=>manualStep(-1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){manualStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'){manualStep(-1);e.preventDefault()}
  else if(e.key===' '){(mode==='play'&&!paused)?$('bPause').click():$('bPlay').click();e.preventDefault()}});
$('bPlay').onclick=()=>{if(mode==='play'&&paused){paused=false;$('st').textContent='재생 재개';tick();return}
  if(mode==='play'&&timer)return;
  initSeq();paused=false;render(false);tick();};
$('bPause').onclick=()=>{if(mode!=='play')return;paused=true;clearTimeout(timer);timer=null;$('st').textContent=`일시정지 — ${LB(cur)}`};
$('bStop').onclick=()=>{clearTimeout(timer);timer=null;paused=false;mode='all';anims.forEach(a=>map.removeLayer(a));anims=[];
  $('cap').classList.remove('show');$('prog').firstChild.style.width='0';items.forEach(it=>it.el&&it.el.classList.remove('act'));
  render(true);$('st').textContent='정지 — 전체 보기';};
render(false);map.fitBounds([[29.5, 30.5], [37.2, 46]]);
</script></body></html>
